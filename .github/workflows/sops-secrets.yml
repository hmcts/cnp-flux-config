name: SOPS secrets check

# pull_request_target runs this workflow and checker from master, so a PR cannot weaken them.
# The PR is only checked out as data; none of its code is executed.
# yamllint disable-line
on:
  pull_request_target:
    branches:
      - master

permissions:
  contents: read

jobs:
  sops_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checker from master
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check Kubernetes Secrets are SOPS encrypted
        working-directory: pr
        run: git ls-files -z '*.yaml' '*.yml' | xargs -0 python ../base/bin/sops-checks/check-sops-secrets.py
