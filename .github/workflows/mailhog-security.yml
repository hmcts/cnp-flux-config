name: MailHog security test

# yamllint disable-line
on:
  pull_request:
    branches:
      - master
    paths:
      - apps/money-claims/cmc-mailhog/cmc-mailhog.yaml
      - tests/mailhog-security.js
      - .github/workflows/mailhog-security.yml

permissions:
  contents: read

jobs:
  mailhog_security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install yq
        run: |
          mkdir -p "$RUNNER_TEMP/mailhog-tools"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/mikefarah/yq/releases/download/v4.30.8/yq_linux_amd64 \
            --output "$RUNNER_TEMP/mailhog-tools/yq"
          chmod +x "$RUNNER_TEMP/mailhog-tools/yq"
          echo "$RUNNER_TEMP/mailhog-tools" >> "$GITHUB_PATH"
      - name: Verify MailHog without privilege escalation
        run: node tests/mailhog-security.js