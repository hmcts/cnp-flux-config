apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ccpay-callback-function
spec:
  values:
    function:
      image: hmctsprod.azurecr.io/ccpay/callback-function:pr-194-2923994-20260916131501 #{"$imagepolicy": "flux-system:demo-ccpay-callback-function"}
      aadIdentityName: ccpay
      buildID: "demo"
      environment:
        S2S_URL: http://rpe-service-auth-provider-demo.service.core-compute-demo.internal
        MICROSERVICE_PAYMENT_APP: "payment_app"
        SERVICE_LOGGING_ENABLED: false
        SERVICE_CALLBACK_URL_PATTERN: "^https?://(?:[a-z0-9-]+-(aat|prod|demo|ithc|perftest)\\.service\\.core-compute-\\1\\.internal|(?:www\\.)?(?:apply-divorce|end-civil-partnership)\\.service\\.gov\\.uk|[a-z0-9-]+\\.preview\\.platform\\.hmcts\\.net)(?:/.*)?$"
        DUMMY_RESTART_VAR: true
        DEAD_LETTER_EMAIL_ENABLED: true
        DEAD_LETTER_SMTP_HOST: "smtp.sendgrid.net"
        DEAD_LETTER_SMTP_PORT: "587"
        DEAD_LETTER_SMTP_SECURE: true
        DEAD_LETTER_SMTP_TLS_PROTOCOL: "TLSv1.2"
        DEAD_LETTER_SMTP_USER: "apikey"
        DEAD_LETTER_EMAIL_FROM: "no-reply@mail-payment-nonprod.platform.hmcts.net"
        DEAD_LETTER_EMAIL_SUBJECT: "CCPay Callback - Message dead-lettered"
        DELAY_MESSAGE_MINUTES: 2
      keyVaults:
        "ccpay":
          secrets:
            - payment-s2s-secret
            - name: spring-mail-password
              alias: DEAD_LETTER_SMTP_PASSWORD
            - name: dead-letter-email-to
              alias: DEAD_LETTER_EMAIL_TO
      triggers:
        - type: azure-servicebus
          topicName: "ccpay-service-callback-topic"
          subscriptionName: serviceCallbackPremiumSubscription
          connectionFromEnv: SERVICE_CALLBACK_BUS_CONNECTION
          queueLength: "1"
          messageCount: "5"
