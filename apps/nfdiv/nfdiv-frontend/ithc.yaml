apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfdiv-frontend
spec:
  releaseName: nfdiv-frontend
  values:
    nodejs:
      ingressHost: nfdiv.ithc.platform.hmcts.net
      image: hmctsprod.azurecr.io/nfdiv/frontend:pr-pr-5072-cb9c688-20261028133543 #{"$imagepolicy": "flux-system:ithc-nfdiv-frontend"}
      environment:
        IDAM_WEB_BASE_URL: https://idam-web-public.ithc.platform.hmcts.net
        IDAM_API_BASE_URL: https://idam-api.ithc.platform.hmcts.net
        WEBCHAT_AVAYA_URL: webchat.pp.ctsc.hmcts.net
        WEBCHAT_AVAYA_CLIENT_URL: webchat-client.pp.ctsc.hmcts.net
        WEBCHAT_AVAYA_SERVICE: Divorce
        DYNATRACE_URL: https://js-cdn.dynatrace.com/jstag/17177a07246/bf24054dsx/2ab4686fc177447_complete.js
        ITHC_TA: autoscaling-test3
        GENESYS_REFERRER_PAGE: Divorce ithc
        GENESYS_BASE_URL: https://apps.euw2.pure.cloud
        GENESYS_ENVIRONMENT: prod-euw2
        GENESYS_KERV_BASE_URL: https://api-preprod.hmcts.hs-cx.com/web-availability
      keyVaults:
        nfdiv:
          resourceGroup: nfdiv
          secrets:
            - idam-secret
            - AppInsightsInstrumentationKey
            - name: azure-managed-redis-access-key
              alias: redis-access-key
            - frontend-secret
            - os-places-token
            - idam-systemupdate-username
            - idam-systemupdate-password
            - pcq-token-key
            - genesys-deployment-id
            - genesys-deployment-id-cy
            - genesys-api-key
            - launch-darkly-sdk-key
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 2
        targetCPUUtilizationPercentage: 80
