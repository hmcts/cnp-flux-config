apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pcq-backend
spec:
  containers:
    - name: pcq-backend-java
      readinessProbe:
        httpGet:
          path: /health/readiness
          port: 4550
        initialDelaySeconds: 10
        periodSeconds: 5

  values:
    java:
      replicas: 2
      spotInstances:
        enabled: false
      autoscaling:
        maxReplicas: 3

    job:
      schedule: "17 22 * * SUN-THU"
      environment:
        PCQ_DISPOSER_ENABLED: true
        PCQ_DISPOSER_DRY_RUN: false
        PCQ_DISPOSER_RATE_LIMIT: 10000
