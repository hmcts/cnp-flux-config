apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dmstore-cron-document-disposer
spec:
  releaseName: dmstore-cron-document-disposer
  values:
    java:
      enabled: false
    job:
      enabled: true
      disableActiveClusterCheck: false
      image: hmctsprod.azurecr.io/dm/store:prod-248b2e3-20261111163608 #{"$imagepolicy": "flux-system:dm-store"}
      environment:
        TASK_NAME: UpdateTtlJob
      schedule: "0 0 31 2 *" #schedule of "0 0 31 2 *" is a mechanism to not run the job at all (31st feb is a nonfiring date)
      global:
        jobKind: CronJob
        enableKeyVaults: true
  chart:
    spec:
      chart: ./stable/dm-store
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
