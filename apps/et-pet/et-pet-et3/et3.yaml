apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: et3
spec:
  releaseName: et3
  values:
    base:
      environment:
      disableTraefikTls: true
      replicas: 2
      useInterpodAntiAffinity: true
      image: hmctsprod.azurecr.io/et-pet/et3:prod-57a5cb6-20260930082617 #{"$imagepolicy": "flux-system:et-pet-et3"}
      memoryLimits: "3072Mi"
      memoryRequests: "512Mi"
      cpuLimits: "500m"
      cpuRequests: "250m"
  chart:
    spec:
      chart: ./stable/et-pet-et3
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
