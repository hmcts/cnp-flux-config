apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: aat-prl-cron-seal-audit
  annotations:
    hmcts.github.com/prod-automated: disabled
spec:
  filterTags:
    pattern: '^pr-3997-[a-f0-9]+-(?P<ts>[0-9]+)'
    extract: '$ts'
  policy:
    alphabetical:
      order: asc
  imageRepositoryRef:
    name: prl-cos

