apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prl-cos
  namespace: private-law
spec:
  releaseName: prl-cos
  values:
    java:
      keyVaults:
        central-app-reg-kv:
          excludeEnvironmentSuffix: true
          secrets:
            - name: tenant-id
              alias: FACT_V2_TENANT_ID
            - name: prl-cos-api-non-prod-app-id
              alias: FACT_V2_CLIENT_ID
            - name: prl-cos-api-non-prod-secret
              alias: FACT_V2_CLIENT_SECRET
      replicas: 2
      memoryRequests: "1536Mi"
      cpuRequests: "1000m"
      memoryLimits: "6144Mi"
      cpuLimits: "2500m"
      readinessDelay: 45
      readinessTimeout: 5
      readinessPeriod: 10
      useInterpodAntiAffinity: true
      image: hmctsprod.azurecr.io/prl/cos:prod-c20809b-20261029083131 #{"$imagepolicy": "flux-system:prl-cos"}
      environment:
        BARRISTER_FEATURE_ENABLED: "true"
        CAFCASS_DATE_TIME_FEATURE_ENABLED: true
        OS_COURT_LOOKUP_ENABLED: true
        FACT_V2_ENABLED: true
        FACT_V2_API_URL: https://cft-api-mgmt.aat.platform.hmcts.net/fact
        FACT_V2_SCOPE: api://6e2a7c9e-0634-4846-8a8e-0af598d905b0/.default
        FEATURE_EXAMPLE: true
        DUMMY_ENV: false
        APP_ENV: "aat"
        CREATE_REQUEST_CIR_UPDATE_TASK_ENABLED: true
        AWAITING_INFORMATION_ENABLED: true
        EXIT_AWAITING_INFORMATION_ENABLED: true
        BUNDLE_BY_CATEGORY_ENABLED: true
        REQUEST_ORDER_TASK_C100_CADENCE: 1
        REQUEST_ORDER_TASK_FL401_CADENCE: 1
        REQUEST_ORDER_TASK_CADENCE_MULTIPLIER: 1
    global:
      environment: aat
      tenantId: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
      enableKeyVaults: true
  chart:
    spec:
      chart: ./stable/prl-cos
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
