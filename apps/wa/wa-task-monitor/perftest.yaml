apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wa-task-monitor
spec:
  values:
    java:
      memoryRequests: "1Gi"
      memoryLimits: "2Gi"
      cpuRequests: "250m"
      cpuLimits: "500m"
      image: hmctsprod.azurecr.io/wa/task-monitor:pr-684-fd30b5e-20260923151322 #{"$imagepolicy": "flux-system:perftest-wa-task-monitor"}
      environment:
        REFRESH_FLAG: ""
        LOGGING_LEVEL_UK_GOV_HMCTS: DEBUG
        INITIATION_CAMUNDA_MAX_RESULTS: 500
        INITIATION_TIME_LIMIT_FLAG: true
        INITIATION_TIME_LIMIT: 120
        WA_INITIATE_TASKS_ON_CREATE_ENABLED: true
        TERMINATION_CAMUNDA_MAX_RESULTS: 500
        TERMINATION_TIME_LIMIT_FLAG: true
        TERMINATION_TIME_LIMIT: 120
