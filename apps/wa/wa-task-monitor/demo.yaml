apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wa-task-monitor
spec:
  values:
    java:
      memoryRequests: "750Mi"
      memoryLimits: "1500Mi"
      cpuRequests: "250m"
      cpuLimits: "500m"
      image: hmctsprod.azurecr.io/wa/task-monitor:prod-ec2dc66-20260807122302 #{"$imagepolicy": "flux-system:demo-wa-task-monitor"}
      environment:
        LOGGING_LEVEL_UK_GOV_HMCTS: DEBUG
        RECONFIGURATION_RETRY_WINDOW_TIME_HOURS: 4
        POSTGRES_HOST: cft-task-postgres-db-flexible-{{ .Values.global.environment }}.postgres.database.azure.com
        POSTGRES_PORT: 5432
        POSTGRES_DB: cft_task_db
        REFRESH_FLAG: "1"
        INITIATION_TIME_LIMIT: 180
        INITIATION_TIME_LIMIT_FLAG: false
