apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wa-workflow-api
spec:
  values:
    java:
      memoryRequests: "750Mi"
      memoryLimits: "1500Mi"
      cpuRequests: "250m"
      cpuLimits: "500m"
      environment:
        REFRESH_FLAG: "Y"
        LOGGING_LEVEL_UK_GOV_HMCTS: DEBUG
        POSTGRES_HOST: wa-workflow-api-postgres-db-flex-demo.postgres.database.azure.com
        DB_READER_USERNAME: "DTS CFT DB Access Reader"
        WA_S2S_AUTHORIZED_SERVICES: "wa_workflow_api,wa_case_event_handler,camunda-bpm,xui_webapp,wa_task_management_api,pcs_api"
      keyVaults:
        wa:
          secrets:
            - name: app-insights-connection-string
              alias: app-insights-connection-string
            - name: s2s-secret-workflow-api
              alias: S2S_SECRET_WORKFLOW_API
            - name: workflow-api-POSTGRES-PASS-V15
              alias: POSTGRES_PASSWORD
            - name: workflow-api-POSTGRES-USER-V15
              alias: POSTGRES_USERNAME
            - name: ld-secret
              alias: LAUNCH_DARKLY_SDK_KEY
