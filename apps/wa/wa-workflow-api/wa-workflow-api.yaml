apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wa-workflow-api
spec:
  releaseName: wa-workflow-api
  values:
    java:
      environment:
        WA_S2S_AUTHORIZED_SERVICES: "wa_workflow_api,wa_case_event_handler,camunda-bpm,xui_webapp,wa_task_management_api,pcs_api"
      replicas: 2
      memoryRequests: "1.5Gi"
      useInterpodAntiAffinity: true
      autoscaling:
        enabled: true
        maxReplicas: 4
      image: hmctsprod.azurecr.io/wa/workflow-api:prod-2dbd7a8-20261120114011 #{"$imagepolicy": "flux-system:wa-workflow-api"}
  chart:
    spec:
      chart: ./stable/wa-workflow-api
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
