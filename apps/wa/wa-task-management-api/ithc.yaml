apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wa-task-management-api
spec:
  values:
    java:
      memoryLimits: "2048Mi"
      memoryRequests: "1280Mi"
      cpuLimits: "2000m"
      cpuRequests: "1000m"
      image: hmctsprod.azurecr.io/wa/task-management-api:prod-b9de5db-20260924114542 #{"$imagepolicy": "flux-system:ithc-wa-task-management-api"}
      environment:
        REFRESH_FLAG: "3"
        ALLOWED_JURISDICTIONS: wa,ia,sscs,civil,publiclaw,privatelaw,st_cic,pcs
        ALLOWED_CASE_TYPES: asylum,wacasetype,sscs,civil,generalapplication,care_supervision_epo,prlapps,privatelaw_exceptionrecord,benefit,criminalinjuriescompensation,bail,pcs
        WA_S2S_AUTHORIZED_SERVICES: ccd,ccd_data,ccd_gw,ccd_ps,iac,wa_task_management_api,xui_webapp,wa_task_monitor,camunda_bpm,wa_workflow_api,wa_case_event_handler,ccd_case_disposer,civil_service,sscs,et_cos,pcs_api
