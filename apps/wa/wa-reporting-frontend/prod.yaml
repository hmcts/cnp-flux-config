apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wa-reporting-frontend
spec:
  values:
    nodejs:
      replicas: 1
      ingressHost: wa-live-reporting.platform.hmcts.net
      environment:
        DUMMY_VAR_FOR_RESTART: 0
        REDIS_CLUSTER: true
        IDAM_PUBLIC_URL: https://hmcts-access.service.gov.uk
        MANAGE_CASE_BASE_URL: https://manage-case.platform.hmcts.net
        WA_BASE_URL: https://wa-live-reporting.platform.hmcts.net
