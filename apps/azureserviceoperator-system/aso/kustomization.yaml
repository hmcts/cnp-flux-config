apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/Azure/azure-service-operator/releases/download/v2.21.1/azureserviceoperator_v2.21.1.yaml
patches:
  - patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/6
        value: --crd-pattern=
      - op: replace
        path: /spec/template/spec/containers/0/args/6
        value: --crd-pattern=managedidentity.azure.com/*;servicebus.azure.com/*;resources.azure.com/*;storage.azure.com/*;dbforpostgresql.azure.com/*
    target:
      kind: Deployment
      name: azureserviceoperator-controller-manager
  - patch: |-
      - op: replace
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.azure.com/agentpool: system
    target:
      kind: Deployment
      name: azureserviceoperator-controller-manager
  - target:
      kind: Deployment
      name: azureserviceoperator-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: azureserviceoperator-controller-manager
      spec:
        strategy:
          type: Recreate
          rollingUpdate: null
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                nodeTaintsPolicy: Honor
                labelSelector:
                  matchLabels:
                    control-plane: controller-manager
  - target:
      kind: Deployment
    path: toleration_replicas_patch.yaml
  - target:
      kind: Deployment
      name: azureserviceoperator-controller-manager
    path: resource_requests_patch.yaml
