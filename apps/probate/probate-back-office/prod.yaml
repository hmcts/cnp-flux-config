apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: probate-back-office
  namespace: probate
spec:
  values:
    java:
      environment:
        CCD_GATEWAY_HOST: https://manage-case.platform.hmcts.net
        IDAM_SERVICE_HOST: https://idam-api.platform.hmcts.net
        PRINTSERVICE_HOST: https://return-case-doc.ccd.platform.hmcts.net
        # Does what it says on the tin - if this changes then prod should redeploy
        CHANGE_TO_REDEPLOY_PROD: 20260324
        PROBATE_GS_ENABLED: true
        AUTHORISED_SERVICES: probate_backend,ccd_data,ccd-datamgmt-api,ccd_ps,ccd,bulk_scan_processor,bulk_scan_orchestrator,payment_app,xui_webapp
        PROBATE_WA_ENABLED: true
