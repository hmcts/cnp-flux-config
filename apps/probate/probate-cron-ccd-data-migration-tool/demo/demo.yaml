apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: probate-cron-ccd-data-migration-tool
spec:
  releaseName: probate-cron-ccd-data-migration-tool
  values:
    job:
      image: hmctsprod.azurecr.io/probate/cron-ccd-data-migration-tool:prod-c84c779-20260727141104
      schedule: "50 9 31 2 *"
      environment:
        TRIG: trig-2
        DEFAULT_THREAD_LIMIT: 25
        MIGRATION_USE_REIMPL: true
        MIGRATION_DRYRUN: false
        USER_TOKEN_REFRESH_MARGIN_MINS: 5
        S2S_TOKEN_REFRESH_MARGIN_MINS: 5
        MIGRATION_ID: DTSPB-5539
        MIGRATION_INITIAL_RUN: true
        MIGRATION_INITIAL_SIZE: 20
        DTSPB_5539_CASE_TYPES: GrantOfRepresentation,Caveat,WillLodgement,StandingSearch
        DTSPB_5539_HMCTS_ID: ABA6