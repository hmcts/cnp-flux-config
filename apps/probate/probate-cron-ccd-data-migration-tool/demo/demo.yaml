apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: probate-cron-ccd-data-migration-tool
spec:
  releaseName: probate-cron-ccd-data-migration-tool
  values:
    job:
      image: hmctsprod.azurecr.io/probate/cron-ccd-data-migration-tool:pr-453-455148c-20261106095315
      schedule: "15 16 6 11 *"
      environment:
        TRIG: trig-2
        PAYMENT_API_URL: http://payment-api-demo.service.core-compute-demo.internal
        DEFAULT_THREAD_LIMIT: 25
        MIGRATION_USE_REIMPL: true
        MIGRATION_DRYRUN: false
        USER_TOKEN_REFRESH_MARGIN_MINS: 5
        S2S_TOKEN_REFRESH_MARGIN_MINS: 5
        MIGRATION_ID: DTSPB-5112-close-expired-rollback
        MIGRATION_INITIAL_RUN: false
        MIGRATION_INITIAL_SIZE: 20
