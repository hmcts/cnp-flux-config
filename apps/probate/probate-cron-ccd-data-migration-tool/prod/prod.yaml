apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: probate-cron-ccd-data-migration-tool
spec:
  releaseName: probate-cron-ccd-data-migration-tool
  values:
    job:
      schedule: "15 20 21 7 *"
      cpuRequests: "1000m"
      cpuLimits: "2500m"
      memoryRequests: "1024Mi"
      memoryLimits: "3072Mi"
      environment:
        TRIG: trig-2
        IDAM_API_URL: https://idam-api.platform.hmcts.net
        PRD_API_URL: http://rd-professional-api-prod.service.core-compute-prod.internal
        MIGRATION_USE_REIMPL: true
        MIGRATION_ID: "DTSPB-5539"
        USER_TOKEN_REFRESH_MARGIN_MINS: 5
        S2S_TOKEN_REFRESH_MARGIN_MINS: 5
        DEFAULT_THREAD_LIMIT: 25
        MIGRATION_DRYRUN: false
        #CASE_REFERENCES:
        DTSPB_5539_CASE_TYPES: GrantOfRepresentation,Caveat,WillLodgement,StandingSearch
        DTSPB_5539_HMCTS_ID: ABA6
        DTSPB_5539_INITIAL_RUN: false
