apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base
  - ../../../base/workload-identity
  - ../../../base/docker-registry/dev
  - ../../../base/resourcequota-pvc.yaml
  - ../../../azureserviceoperator-system/resources/resource-group.yaml
  - ../../../azureserviceoperator-system/resources/flexibleserver-postgres.yaml
  - ../../../azureserviceoperator-system/resources/flexibleserver-postgres-config.yaml
  - ../../draft-store-service/sops-secrets
namespace: rpe
patches:
  - path: ../../draft-store-service/aso/postgres.yaml
  - path: ../../serviceaccount/aat.yaml
  # this patch bumps customer team version to v17 while keeping the shared one on 2023 
  - path: ../patches/postgres-apiv20250801-v17.yaml
    target:
      group: dbforpostgresql.azure.com
      # version here matches the shared template's api version
      version: v1api20230601preview
      kind: FlexibleServer
sortOptions:
  order: fifo
