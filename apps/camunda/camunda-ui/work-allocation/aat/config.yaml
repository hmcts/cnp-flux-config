apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: camunda-ui
spec:
  values:
    java:
      environment:
        WA_INITIATE_TASKS_ON_CREATE_ENABLED: true
      keyVaults:
        camunda:
          secrets:
            - name: bpm-POSTGRES-PASS
              alias: spring.datasource.password
            - name: camunda-admin-password
              alias: CAMUNDA_ADMIN_PASSWORD
            - name: openid-client-id
              alias: CLIENT_ID
            - name: openid-client-secret
              alias: CLIENT_SECRET
            - name: app-insights-connection-string
              alias: app-insights-connection-string
            - name: s2s-secret-camunda-bpm
              alias: S2S_SECRET_CAMUNDA_BPM
