apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: am-org-role-mapping-service
spec:
  values:
    java:
      environment:
        AM_INFO: false
        APPLICATION_LOGGING_LEVEL: INFO
        OPEN_ID_API_BASE_URI: https://hmcts-access.service.gov.uk/o
        IDAM_USER_URL: https://idam-api.platform.hmcts.net
        # PRD Config
        PROFESSIONAL_REFRESH_API_ENABLED: true
        PROFESSIONAL_SCHEDULING_ENABLED: true
        # PRM Schedules
        # PRM-1
        CRON_PRM_P1_FIND_CASE_DEFINITION_CHANGES: "0 30 19 * * FRI-SUN"
        CRON_PRM_P1_LOCK_AT_LEAST_FOR: "PT1M"
        CRON_PRM_P1_LOCK_AT_MOST_FOR: "PT5M"
        # PRM-2
        CRON_PRM_P2_ORGS_STALE_PROFILES: "0 35 19 * * FRI-SUN"
        CRON_PRM_P2_LOCK_AT_LEAST_FOR: "PT1M"
        CRON_PRM_P2_LOCK_AT_MOST_FOR: "PT5M"
        # PRM-3
        CRON_PRM_P3_ORG_CHANGES: "0 40 19 * * FRI-SUN"
        CRON_PRM_P3_LOCK_AT_LEAST_FOR: "PT10M"
        CRON_PRM_P3_LOCK_AT_MOST_FOR: "PT30M"
        # PRM-4
        CRON_PRM_P4_USERS_STALE_ORGS: "0 00 20 * * FRI-SUN"
        CRON_PRM_P4_LOCK_AT_LEAST_FOR: "PT20M"
        CRON_PRM_P4_LOCK_AT_MOST_FOR: "PT30M"
        # PRM-5
        CRON_PRM_P5_USER_CHANGES: "0 30 20 * * FRI-SUN"
        CRON_PRM_P5_LOCK_AT_LEAST_FOR: "PT5M"
        CRON_PRM_P5_LOCK_AT_MOST_FOR: "PT30M"
        # PRM-6
        CRON_PRM_P6_USER_REFRESH: "0 45 20 * * FRI-SUN"
        CRON_PRM_P6_LOCK_AT_LEAST_FOR: "PT30M"
        CRON_PRM_P6_LOCK_AT_MOST_FOR: "PT180M"
        # PRM-Cleanup Org
        CRON_PRM_REFRESH_CLEANUP_ORG: "-"
        # PRM-Cleanup User
        CRON_PRM_REFRESH_CLEANUP_USER: "-"
        # Refresh Job Config
        # REFRESH_JOB: LEGAL_OPERATIONS-IA-NEW-0-186
        # Other
        DUMMY_VAL: false
