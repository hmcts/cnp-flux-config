apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: am-org-role-mapping-service
spec:
  values:
    java:
      image: hmctsprod.azurecr.io/am/org-role-mapping-service:prod-88bed2d-20260915160340 #{"$imagepolicy": "flux-system:demo-am-org-role-mapping-service"}
      environment:
        AM_INFO: true
        APPLICATION_LOGGING_LEVEL: INFO
        DB_FEATURE_FLAG_ENABLE: probate_wa_1_0
        TESTING_SUPPORT_ENABLED: true
        # PRD Config
        PROFESSIONAL_REFRESH_API_ENABLED: true
        PROFESSIONAL_SCHEDULING_ENABLED: false
        # Refresh Job Config
        REFRESH_JOB: LEGAL_OPERATIONS-IA-NEW-0-81
        # always set 'REFRESH_JOB_ALLOW_UPDATE' to false before next refresh (i.e. only use when setting existing job to ABORTED)
        # REFRESH_JOB_ALLOW_UPDATE: false
        # Other
        DUMMY_VAR: true
