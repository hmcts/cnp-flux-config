      image: hmctsprod.azurecr.io/am/role-assignment-service:prod-2e1cf9e-20261006161454 #{"$imagepolicy": "flux-system:ithc-am-role-assignment-service"}
      environment:
        AM_INFO: true
        APPLICATION_LOGGING_LEVEL: DEBUG
        DB_FEATURE_FLAG_ENABLE: ga_prm_1_0
