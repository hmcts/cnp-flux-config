apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: am-role-assignment-service
spec:
  values:
    java:
      replicas: 4
      memoryRequests: "4096Mi"
      memoryLimits: "5120Mi"
      autoscaling:
        enabled: false
      environment:
        AM_INFO: false
        APPLICATION_LOGGING_LEVEL: INFO
        TESTING_SUPPORT_ENABLED: true
        BYPASS_ORG_DROOL_RULE: true
        DB_FEATURE_FLAG_ENABLE: fr_wa_1_0
        ROLE_ASSIGNMENT_S2S_AUTHORISED_SERVICES: am_role_assignment_service,am_org_role_mapping_service,am_role_assignment_refresh_batch,wa_task_management_api,wa_task_configuration_api,xui_webapp,aac_manage_case_assignment,ccd_data,wa_task_monitor,wa_case_event_handler,iac,ccd_case_disposer,hmc_cft_hearing_service,rd_caseworker_ref_api,sscs,fis_hmc_api,fpl_case_service,et_cos,disposer-idam-user,civil_service,prl_cos_api,pcs_api,wa_reporting_frontend,pt_api
        MAX_POOL_SIZE: 20
        DUMMY_VAR: false
        JWT_ISSUER_VALIDATION_ENABLED: true
        IDAM_SECURITY_ALLOWED_ISSUERS_0: https://idam-web-public.aat.platform.hmcts.net/o
        IDAM_SECURITY_ALLOWED_ISSUERS_1: https://hmcts-access.aat.platform.hmcts.net/o
        IDAM_SECURITY_ALLOWED_ISSUERS_2: https://forgerock-am.service.core-compute-idam-aat2.internal:8443/openam/oauth2/realms/root/realms/hmcts
