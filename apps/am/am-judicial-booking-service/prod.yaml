apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: am-judicial-booking-service
spec:
  values:
    java:
      environment:
        AM_INFO: true
        OPEN_ID_API_BASE_URI: https://hmcts-access.service.gov.uk/o
        IDAM_USER_URL: https://hmcts-access.service.gov.uk
        APPLICATION_LOGGING_LEVEL: INFO
        DUMMY_VAR: false
        TESTING_SUPPORT_ENABLED: false
        JWT_ISSUER_VALIDATION_ENABLED: true
        IDAM_SECURITY_ALLOWED_ISSUERS_0: https://hmcts-access.service.gov.uk/o
        IDAM_SECURITY_ALLOWED_ISSUERS_1: https://forgerock-am.service.core-compute-idam-prod2.internal:8443/openam/oauth2/realms/root/realms/hmcts
