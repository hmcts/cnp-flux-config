apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: am-role-assignment-refresh-batch
spec:
  values:
    job:
      # requested default for PerfTest is 08:45, "45 08 * * *"
      schedule: "45 08 * * *"
      environment:
        AM_INFO: true
        DELETE_ORG: true
        REFRESH_JOB_DELAY_DURATION: 60000
        EMAIL_ENABLED: true
