apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cath-postgres
spec:
  releaseName: cath-postgres
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      strategy: uninstall
      retries: 3
  values:
    nodejs:
      releaseNameOverride: cath-postgres
      image: hmctsprod.azurecr.io/cath/cath-postgres:prod-a940d4b-20260907101306 # {"$imagepolicy": "flux-system:cath-postgres"}
  chart:
    spec:
      chart: cath-postgres
      version: ">=0.1.0-0"
      sourceRef:
        kind: HelmRepository
        name: hmctsprod-oci
        namespace: flux-system
      interval: 1m
