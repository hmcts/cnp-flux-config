apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cath-postgres
spec:
  releaseName: cath-postgres
  values:
    nodejs:
      # No ingress in prod. This pod only migrates and seeds the database; its port
      # also serves Prisma Studio, an unauthenticated database UI.
      ingressHost: ""
