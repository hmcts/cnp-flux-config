apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cath
resources:
  - ../../base
  - ../../../rbac/nonprod-role.yaml
  - ../../../rbac/db-query-job-role.yaml
  - ../../cath-web/cath-web.yaml
  - ../../cath-api/cath-api.yaml
  - ../../cath-crons/cath-crons.yaml
  - ../../cath-postgres/cath-postgres.yaml
  - ../../../base/slack-provider/perftest
  - ../../../base/docker-registry/perftest
patches:
  - path: ../../identity/perftest.yaml
  - path: ../../serviceaccount/perftest.yaml
  - path: ../../cath-web/perftest.yaml
  - path: ../../cath-api/perftest.yaml
  - path: ../../cath-crons/perftest.yaml
  - path: ../../cath-postgres/perftest.yaml
