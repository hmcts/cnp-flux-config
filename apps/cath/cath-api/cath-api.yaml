apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cath-api
spec:
  releaseName: cath-api
  interval: 5m
  install:
    remediation:
      retries: 3
    upgrade:
      remediation:
        strategy: uninstall
        retries: 3
  values:
    nodejs:
      releaseNameOverride: cath-api
      image: hmctsprod.azurecr.io/cath/cath-api:prod-50dd8da-20260904154024 # {"$imagepolicy": "flux-system:cath-api"}
  chart:
    spec:
      chart: cath-api
      version: ">=0.1.0-0"
      sourceRef:
        kind: HelmRepository
        name: hmctsprod-oci
        namespace: flux-system
      interval: 1m
