apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cath-media-reporting-cron
spec:
  releaseName: cath-media-reporting-cron
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      strategy: uninstall
      retries: 3
  values:
    job:
      releaseNameOverride: cath-media-reporting-cron
      image: hmctsprod.azurecr.io/cath/cath-crons:prod-cd2524a-20261019125417 #{"$imagepolicy": "flux-system:cath-media-reporting-cron"}
      environment:
        SCRIPT_NAME: media-reporting
  chart:
    spec:
      chart: cath-crons
      version: ">=0.1.0-0"
      sourceRef:
        kind: HelmRepository
        name: hmctsprod-oci
        namespace: flux-system
      interval: 1m
