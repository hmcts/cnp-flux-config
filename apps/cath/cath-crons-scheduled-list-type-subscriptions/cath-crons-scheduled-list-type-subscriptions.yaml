apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cath-crons-scheduled-list-type-subscriptions
spec:
  releaseName: cath-crons-scheduled-list-type-subscriptions
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      strategy: uninstall
      retries: 3
  values:
    job:
      releaseNameOverride: cath-crons-scheduled-list-type-subscriptions
      image: hmctsprod.azurecr.io/cath/cath-crons:prod-463fc17-20261029103700 # {"$imagepolicy": "flux-system:cath-crons"}
      schedule: "30 10 * * *"
      disableActiveClusterCheck: false
      environment:
        SCRIPT_NAME: scheduled-list-type-subscriptions
  chart:
    spec:
      chart: cath-crons
      version: ">=0.1.0-0"
      sourceRef:
        kind: HelmRepository
        name: hmctsprod-oci
        namespace: flux-system
      interval: 1m
