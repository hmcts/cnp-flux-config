apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cft-listing-data-api
spec:
  releaseName: cft-listing-data-api
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      # Without it the chart mounts no Key Vault secret, and the service has no consumer permissions.
      enableKeyVaults: true
    python:
      image: hmctsprod.azurecr.io/pvp/cft-listing-data-api:prod-cd33c84-20261126093900 # {"$imagepolicy": "flux-system:cft-listing-data-api"}
  chart:
    spec:
      chart: cft-listing-data-api
      version: ">=0.1.0-0"
      sourceRef:
        kind: HelmRepository
        name: hmctsprod-oci
        namespace: flux-system
      interval: 1m
