apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: civil-service
  namespace: civil
spec:
  values:
    java:
      replicas: 4
      autoscaling:
        maxReplicas: 8
      environment:
        OIDC_ISSUER: https://forgerock-am.service.core-compute-idam-prod2.internal:8443/openam/oauth2/realms/root/realms/hmcts
        IDAM_API_URL: https://idam-api.platform.hmcts.net
        IDAM_WEB_URL: https://hmcts-access.service.gov.uk
        SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: https://hmcts-access.service.gov.uk/o/jwks
        SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: https://forgerock-am.service.core-compute-idam-prod2.internal:8443/openam/oauth2/realms/root/realms/hmcts
        MANAGE_CASE_UI_BASE_URL: https://manage-case.platform.hmcts.net
        AUTH_IDAM_CLIENT_BASEURL: https://idam-api.platform.hmcts.net
        DOCMOSIS_TORNADO_URL: https://docmosis.platform.hmcts.net
        TESTING_SUPPORT_ENABLED: false
        DOCUMENT_MANAGEMENT_SECURED: true
        DOCSTORE_DOC_REMOVAL_ENABLED: true
        CUI_URL: https://www.moneyclaims.service.gov.uk
        CUI_URL_RESPOND_TO_CLAIM: https://www.moneyclaims.service.gov.uk/first-contact/start
        OCMC_CLIENT_URL: https://www1.moneyclaims.service.gov.uk
        POLLING_EVENT_EMITTER_ENABLED: true
        ROLE_INITIALISATION_ENABLED: true
        HMC_HEARINGS_SUBSCRIPTION_ENABLED: true
        REFERENCE_DATABASE_MIGRATION: true
        CCD_EVENTS_SUBSCRIPTION_ENABLED: false
        CACHE_BOUNCE_VAR: 1
        DUMMY_VAR: 3
        MIGRATION_BATCHSIZE: 5000
        CCD_SDK_DECENTRALISED_ES_INDEXER_ENABLED: false # keep off until cutover so preloaded cases are never indexed
        CIVIL_CCD_DATA_MIGRATION_ENABLED: true
        CIVIL_CCD_DATA_MIGRATION_MODE: PRELOAD_EVENTS
        CIVIL_CCD_DATA_MIGRATION_CRON: "0 0-40/10 0-5,19-23 * * *" # pods run in UTC: 19:00-05:40 UTC (20:00-06:40 BST, 19:00-05:40 GMT), out of service hours
        CIVIL_CCD_DATA_MIGRATION_MAX_RUN_TIME: 10m # default 2h would carry the last run (05:40 UTC) into the morning
        CCD_DATA_MIGRATION_EVENT_ID_WINDOW_SIZE: "100000" # dense Civil windows exceed the 10m statement timeout at 1M
        CCD_DATA_MIGRATION_STATEMENT_TIMEOUT: 30m
      spotInstances:
        enabled: false
