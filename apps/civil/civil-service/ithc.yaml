apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: civil-service
  namespace: civil
spec:
  values:
    java:
      image: hmctsprod.azurecr.io/civil/service:prod-a36f82b-20261028111842 #{"$imagepolicy": "flux-system:civil-service"}
      environment:
        TESTING_SUPPORT_ENABLED: true
        EM_CCD_ORCHESTRATOR_URL: http://em-ccd-orchestrator-ithc.service.core-compute-ithc.internal
        REFERENCE_DATABASE_MIGRATION: true
        SPRING_FLYWAY_TABLE: schema_version
        SPRING_FLYWAY_BASELINE_ON_MIGRATE: true
        POLLING_EVENT_EMITTER_ENABLED: true
        CCD_SDK_DECENTRALISED_ES_INDEXER_ENABLED: false # keep off until cutover so preloaded cases are never indexed
        CIVIL_CCD_DATA_MIGRATION_ENABLED: true
        CIVIL_CCD_DATA_MIGRATION_MODE: PRELOAD_EVENTS
        CIVIL_CCD_DATA_MIGRATION_CRON: "0 */10 * * * *" # every 10mins, 24/7 (db lock prevents parallel running)
        CCD_DATA_MIGRATION_EVENT_ID_WINDOW_SIZE: "100000" # dense Civil windows exceed the 10m statement timeout at 1M
        CCD_DATA_MIGRATION_STATEMENT_TIMEOUT: 30m
