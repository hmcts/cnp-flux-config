apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pt-frontend
spec:
  releaseName: pt-frontend
  values:
    nodejs:
      replicas: 2
      image: hmctsprod.azurecr.io/pt/frontend:prod-8ee3cc0-20261009110207 #{"$imagepolicy": "flux-system:pt-frontend"}
      autoscaling:
        enabled: true
        maxReplicas: 4
      memoryRequests: "1Gi"
      memoryLimits: "2Gi"
      cpuRequests: "500m"
      cpuLimits: "1000m"
      environment:
        VAR_TA: 1
  chart:
    spec:
      chart: ./stable/pt-frontend
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
