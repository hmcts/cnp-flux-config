apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: idam-hmcts-access
  namespace: idam
spec:
  releaseName: idam-hmcts-access
  values:
    nodejs:
      pdb:
        enabled: false
      replicas: 1
      ingressHost: hmcts-access.sandbox.platform.hmcts.net
      disableTraefikTls: true
      environment:
        STRATEGIC_SERVICE_URL: 'https://idam-api.sandbox.platform.hmcts.net'
        STRATEGIC_TESTING_URL: 'https://idam-testing-support-api.sandbox.platform.hmcts.net'
        PASSWORD_RESET_V2_ENABLED: true
        SSO_FUNCTIONAL_DISPLAY_NAME: Functional domain-routing test    
        SSO_FUNCTIONAL_DOMAIN: functional.test    
        SSO_FUNCTIONAL_LOGIN_URL: /auth/functional-test-sso/login
