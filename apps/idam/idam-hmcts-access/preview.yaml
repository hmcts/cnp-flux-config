apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: idam-hmcts-access
  namespace: idam
spec:
  releaseName: idam-hmcts-access
  values:
    nodejs:
      replicas: 1
      disableTraefikTls: false
      ingressHost: hmcts-access.preview.platform.hmcts.net
      environment:
        STRATEGIC_SERVICE_URL: 'http://idam-api'
        STRATEGIC_TESTING_URL: 'http://idam-testing-support-api'
        PASSWORD_RESET_V2_ENABLED: true
        SSO_FUNCTIONAL_DISPLAY_NAME: Functional domain-routing test    
        SSO_FUNCTIONAL_DOMAIN: functional.test
        SSO_FUNCTIONAL_LOGIN_URL: /auth/functional-test-sso/login
        trigger: deploy
