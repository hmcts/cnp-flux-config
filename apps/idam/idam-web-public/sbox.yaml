apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: idam-web-public
  namespace: idam
spec:
  values:
    java:
      keyVaults:
        "idam-idam":
          resourceGroup: idam-idam
          secrets:
            - name: AppInsightsConnectionString
              alias: app-insights-connection-string
            - name: AppInsightsInstrumentationKey
              alias: azure.application-insights.instrumentation-key
            - name: managed-redis-hostname
              alias: spring.redis.host
            - name: managed-redis-key
              alias: spring.redis.password
            - name: managed-redis-port
              alias: spring.redis.port
            - name: sso-client-id
              alias: spring.security.oauth2.client.registration.oidc.client-id
            - name: sso-client-secret
              alias: spring.security.oauth2.client.registration.oidc.client-secret
            - name: sso-client-id-moj
              alias: spring.security.oauth2.client.registration.moj.client-id
            - name: sso-client-secret-moj
              alias: spring.security.oauth2.client.registration.moj.client-secret
      ingressHost: idam-web-public.sandbox.platform.hmcts.net
      disableTraefikTls: true
      replicas: 1
      cpuRequests: '60m'
      cpuLimits: '1500m'
      memoryRequests: '1536Mi'
      memoryLimits: '2048Mi'
      environment:
        STRATEGIC_SERVICE_URL: http://idam-api
        STRATEGIC_ENDPOINT_FORGOTPASSWORD: forgotPasswordDetails
        spring.security.oauth2.client.provider.moj.issuer-uri: https://sts.windows.net/34c125c9-c7f3-486f-a78c-cf762c718831/
        SSOEMAILDOMAINS_EJUDICIARY_NET: ejudiciary-aad
        strategic_content_security_policy_form_action: "https: http:"
        TRIGGER: false
  chart:
    spec:
      chart: ./stable/idam-web-public
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
