apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ccd-case-activity-api
spec:
  releaseName: ccd-case-activity-api
  values:
    nodejs:
      environment:
        REDIS_ACTIVITY_TTL: 15
        REDIS_HOST: ccd-case-activity-api-{{ .Values.global.environment }}.uksouth.redis.azure.net
        REDIS_PORT: 10000
        DUMMY_VAR: 1
      keyVaults:
        ccd:
          secrets:
            - name: activity-managed-redis-password
              alias: activity-redis-password
            - name: app-insights-connection-string
