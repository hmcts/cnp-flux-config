apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ccd-logstash-ethos
  namespace: ccd
spec:
  releaseName: ccd-logstash-ethos
  values:
    replicas: 1
    logstashPipeline:
      01_input.conf: |
        input {
          jdbc {
            jdbc_connection_string => "${DATA_STORE_URL}"
            jdbc_user => "${DATA_STORE_USER}"
            jdbc_password => "${DATA_STORE_PASS}"
            jdbc_validate_connection => true
            jdbc_driver_library => "/usr/share/logstash/ccd/postgresql.jar"
            jdbc_driver_class => "org.postgresql.Driver"
            jdbc_default_timezone => "UTC"
            parameters => {
                        "jurisdiction" => "EMPLOYMENT"
                          }
            statement => "WITH candidates AS (SELECT q.id FROM case_data_logstash_queue q JOIN case_data cd ON q.case_data_id = cd.id WHERE q.case_data_id = cd.id AND jurisdiction = :jurisdiction ORDER BY q.id FOR UPDATE OF q SKIP LOCKED LIMIT 1000) DELETE FROM case_data_logstash_queue q USING candidates c, case_data cd WHERE q.id = c.id AND q.case_data_id = cd.id RETURNING q.id AS version, cd.id, created_date, last_modified, jurisdiction, case_type_id, state, last_state_modified_date, data::TEXT as json_data, data_classification::TEXT as json_data_classification, reference, security_classification, supplementary_data::TEXT as json_supplementary_data"
            clean_run => false
            schedule => "* * * * * *"
          }
        }
