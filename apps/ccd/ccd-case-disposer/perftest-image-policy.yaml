apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: perftest-ccd-case-disposer
  annotations:
    hmcts.github.com/prod-automated: false
spec:
  filterTags:
    pattern: '^pr-983-[a-f0-9]+-(?P<ts>[0-9]+)'
    extract: '$ts'
  policy:
    alphabetical:
      order: asc
  imageRepositoryRef:
    name: ccd-case-disposer
