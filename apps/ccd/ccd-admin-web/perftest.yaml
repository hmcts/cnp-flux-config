apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ccd-admin-web
spec:
  releaseName: ccd-admin-web
  values:
    nodejs:
      image: hmctsprod.azurecr.io/ccd/admin-web:prod-4cce8fc-20261027220242 #{"$imagepolicy": "flux-system:perftest-ccd-admin-web"}
      memoryLimits: "1Gi"
      memoryRequests: "768Mi"
      environment:
        ADMINWEB_ELASTIC_INDEX_URL: http://ccd-definition-store-api-perftest.service.core-compute-perftest.internal/elastic-support/index
        DUMMY_RESTART_VAR: 3
        IDAM_WEB_PUBLIC_URL: https://idam-web-public.perftest.platform.hmcts.net
        IDAM_HMCTS_ACCESS_URL: https://hmcts-access.perftest.platform.hmcts.net
        IDAM_OAUTH2_SCOPE: "openid profile roles"
