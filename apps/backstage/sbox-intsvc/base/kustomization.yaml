apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- backstage-values.enc.yaml
- backstage-github-app.yaml

patches:
- path: ../../backstage/sbox-intsvc.yaml
- path: ../../serviceaccount/sbox-intsvc.yaml
- path: backstage-serviceaccount-patch.yaml
  target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: backstage
    namespace: backstage
