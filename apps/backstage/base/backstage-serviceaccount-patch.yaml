- op: add
  path: /spec/postRenderers/0/kustomize/patches/-
  value:
    target:
      group: apps
      version: v1
      kind: Deployment
      name: backstage
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backstage
      spec:
        template:
          spec:
            serviceAccountName: backstage
            automountServiceAccountToken: false
