apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage
  namespace: backstage
spec:
  releaseName: backstage
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: backstage
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: backstage
              spec:
                template:
                  spec:
                    containers:
                      - name: backstage
                        readinessProbe:
                          httpGet:
                            path: /health/catalog
                            port: 7007
                          periodSeconds: 10
                          timeoutSeconds: 5
                          failureThreshold: 3
  values:
    ingress:
      annotations:
        traefik.ingress.kubernetes.io/router.tls: "true"
      enabled: true
    backend:
      replicaCount: 2
      image: hmctsprod.azurecr.io/backstage-portal/backend:prod-f0dcfa6c-1790597703 # {"$imagepolicy": "flux-system:backstage-portal-backend"}
      resources:
        requests:
          memory: 2048Mi
        limits:
          memory: 4096Mi
  valuesFrom:
    - kind: Secret
      name: backstage-values
  chart:
    spec:
      chart: backstage
      version: 0.2.27
      sourceRef:
        kind: HelmRepository
        name: backstage
        namespace: backstage
