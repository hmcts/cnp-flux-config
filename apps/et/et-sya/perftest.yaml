apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: et-sya
  namespace: et
spec:
  releaseName: et-sya
  values:
    nodejs:
      image: hmctsprod.azurecr.io/et/sya:prod-95831d8-20260917072116 #{"$imagepolicy": "flux-system:perftest-et-sya"}
      ingressHost: et-sya.perftest.platform.hmcts.net
      keyVaults:
        et:
          secrets:
            - app-insights-connection-string
            - idam-secret
            - et-redis-access-key
            - et-managed-redis-access-key
            - et-session-secret
            - os-places-token
            - pcq-token-key
            - launch-darkly-sdk-key
            - csrf-token-secret
            - s2s-secret-sya
      environment:
        MANAGE_ORG_URL: 'https://manage-org.perftest.platform.hmcts.net'
        MANAGE_CASE_URL: 'https://manage-case.perftest.platform.hmcts.net'
        HMCTS_ACCESS: 'true'
        REDIS_SECONDARY_HOST: 'et-managed-redis-perftest.uksouth.redis.azure.net'
        REDIS_SECONDARY_PORT: '10000'
