apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: et-syr
  namespace: et
spec:
  releaseName: et-syr
  values:
    nodejs:
      image: hmctsprod.azurecr.io/et/syr:pr-951-b3b4da1-20260925083158 #{"$imagepolicy": "flux-system:demo-et-syr"}
      ingressHost: et-syr.demo.platform.hmcts.net
      environment:
        HMCTS_ACCESS: 'true'
        ET3_LEGACY_URL: https://et-pet-et3.demo.platform.hmcts.net/users/sign_up
        S2S_URL: 'http://rpe-service-auth-provider-demo.service.core-compute-demo.internal'
        CUI_URL: 'https://cui-ra.demo.platform.hmcts.net'
        CUI_YOUR_SUPPORT_ENABLED_CASE_TYPE_IDS: 'ET_Scotland'
        REDIS_DUAL_WRITE_ENABLED: 'true'
        REDIS_READ_FROM: 'secondary'
