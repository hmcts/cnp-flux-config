apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: et-syr
  namespace: et
spec:
  releaseName: et-syr
  values:
    nodejs:
      image: hmctsprod.azurecr.io/et/syr:pr-1009-44e3d8a-20260918094332 #{"$imagepolicy": "flux-system:perftest-et-syr"}
      ingressHost: et-syr.perftest.platform.hmcts.net
      keyVaults:
        et:
          secrets:
            - AppInsightsInstrumentationKey
            - idam-secret
            - name: et-managed-redis-access-key
              alias: et-redis-access-key
            - et-session-secret
            - os-places-token
            - pcq-token-key
            - launch-darkly-sdk-key
            - s2s-secret-syr
      environment:
        REDIS_HOST: 'et-managed-redis-perftest.uksouth.redis.azure.net'
        REDIS_PORT: '10000'
        HMCTS_ACCESS: 'true'
        ET3_LEGACY_URL: https://et-pet-et3.perftest.platform.hmcts.net/users/sign_up
