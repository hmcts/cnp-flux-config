apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: et-syr
  namespace: et
spec:
  releaseName: et-syr
  values:
    nodejs:
      image: hmctsprod.azurecr.io/et/syr:prod-7eae4c4-20260917080724 #{"$imagepolicy": "flux-system:perftest-et-syr"}
      ingressHost: et-syr.perftest.platform.hmcts.net
      keyVaults:
        et:
          secrets:
            - AppInsightsInstrumentationKey
            - idam-secret
            - et-redis-access-key
            - et-managed-redis-access-key
            - et-session-secret
            - os-places-token
            - pcq-token-key
            - launch-darkly-sdk-key
            - s2s-secret-syr
      environment:
        HMCTS_ACCESS: 'true'
        ET3_LEGACY_URL: https://et-pet-et3.perftest.platform.hmcts.net/users/sign_up
        REDIS_SECONDARY_HOST: 'et-managed-redis-perftest.uksouth.redis.azure.net'
        REDIS_SECONDARY_PORT: '10000'
