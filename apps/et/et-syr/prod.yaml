apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: et-syr
  namespace: et
spec:
  releaseName: et-syr
  values:
    nodejs:
      ingressHost: 'www.respond-employment-tribunals.service.gov.uk'
      keyVaults:
        et:
          secrets:
            - AppInsightsInstrumentationKey
            - idam-secret
            - name: et-managed-redis-access-key
              alias: et-redis-access-key
            - et-session-secret
            - os-places-token
            - pcq-token-key
            - launch-darkly-sdk-key
            - s2s-secret-syr
      environment:
        REDIS_HOST: 'et-managed-redis-prod.uksouth.redis.azure.net'
        REDIS_PORT: '10000'
        IDAM_WEB_URL: 'https://hmcts-access.service.gov.uk/login'
        IDAM_API_URL: 'https://idam-api.platform.hmcts.net/o/token'
        MANAGE_ORG_URL: 'https://manage-org.platform.hmcts.net'
        MANAGE_CASE_URL: 'https://manage-case.platform.hmcts.net'
        IDAM_END_SESSION_URL: 'https://hmcts-access.service.gov.uk/o/endSession'
        ET_SYA_API_HOST: 'http://et-cos-prod.service.core-compute-prod.internal'
        HMCTS_ACCESS: 'true'
        IDAM_WEB_URL_HMCTS_ACCESS: 'https://hmcts-access.service.gov.uk/o/authorize'
