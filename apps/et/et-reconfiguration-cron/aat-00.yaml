apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: et-reconfiguration-cron
spec:
  releaseName: et-reconfiguration-cron
  values:
    job:
      environment:
        CRON_CASE_TYPE_ID: ET_EnglandWales,ET_Scotland
        TASK_NAME: ClearCaseTtlTask
        CRON_CLEAR_CASE_TTL_DRY_RUN: false
        CRON_CLEAR_CASE_TTL_MAX_CASES_PER_SEARCH: 5000
        CRON_CLEAR_CASE_TTL_MAX_CASES_TO_PROCESS: 5000
      suspend: true
      schedule: "*/10 * * * *"
    global:
      jobKind: CronJob
      enableKeyVaults: true
      environment: aat
