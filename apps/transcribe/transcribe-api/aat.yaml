apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: transcribe-api
spec:
  values:
    python:
      environment:
        # Flux does not apply the Jenkins-only values.aat.template.yaml, so its
        # AAT settings are repeated here.
        # transcribe-web's public hostname (Front Door).
        APP_URL: https://benchnotes.aat.platform.hmcts.net
        # courtstranscribe's dev MoJ-tenant app registration: the audience of
        # the tokens transcribe-web sends.
        AZURE_AD_CLIENT_ID: a6407440-40bc-48da-94d6-170febce9384
