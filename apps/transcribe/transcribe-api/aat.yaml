apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: transcribe-api
spec:
  values:
    python:
      environment:
        # Flux does not apply the Jenkins values.aat.template.yaml.
        APP_URL: https://benchnotes.aat.platform.hmcts.net
        # benchnotes-aat (hmcts/central-app-registration), HMCTS tenant.
        AZURE_AD_CLIENT_ID: 18996d70-494e-4ddb-9ebd-17b4a1077314
        # A user must hold one of these app roles (backs up "Assignment required").
        AUTH_ACCESS_ROLES: Judge,LegalTextManager,SystemAdministrator,Normal
