apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: transcribe-api
spec:
  values:
    python:
      replicas: 2
      memoryRequests: "512Mi"
      memoryLimits: "1024Mi"
      environment:
        APP_URL: https://benchnotes.platform.hmcts.net
        # benchnotes-prod (hmcts/central-app-registration), HMCTS tenant.
        AZURE_AD_CLIENT_ID: 52db7e57-2640-46cf-a881-288f740b21bc
        AUTH_ACCESS_ROLES: Judge,LegalTextManager,SystemAdministrator,Normal
    worker:
      environment:
        APP_URL: https://benchnotes.platform.hmcts.net
        AZURE_AD_CLIENT_ID: 52db7e57-2640-46cf-a881-288f740b21bc
