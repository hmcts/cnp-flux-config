apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: transcribe-web
spec:
  dependsOn:
    - name: transcribe-api
  values:
    nodejs:
      environment:
        # Flux does not apply the Jenkins-only values.aat.template.yaml, so its
        # AAT settings are repeated here. The chart's values.yaml already sets
        # the public hostname benchnotes.aat.platform.hmcts.net (ingressHost,
        # APP_URL) and the API's internal URL.
        # courtstranscribe's dev MoJ-tenant app registration;
        # https://benchnotes.aat.platform.hmcts.net/auth/callback is one of its
        # redirect URIs.
        AZURE_AD_CLIENT_ID: a6407440-40bc-48da-94d6-170febce9384
