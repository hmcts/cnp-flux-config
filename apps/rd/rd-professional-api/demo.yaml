apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rd-professional-api
spec:
  values:
    java:
      environment:
        DUMMY_VAR: true
        DELETE_ORG: true
        ACTIVE_ORG_EXT: true
        PRD_S2S_AUTHORISED_SERVICES: rd_professional_api,rd_user_profile_api,xui_webapp,finrem_payment_service,finrem_case_orchestration,finrem_citizen_ui,fpl_case_service,iac,aac_manage_case_assignment,divorce_frontend,nfdiv_case_api,am_org_role_mapping_service,probate_backend,civil_service,payment_app,prl_cos_api,civil_general_applications,et_cos,pcs_api,pt_api
        CONTAINER_NAME: rd-prd-data
        SCHEDULER_ENABLED: false
        CRON_EXPRESSION: "0 0 0 25 03 ?"
        JPA_OPEN-IN-VIEW: false
        JWT_ISSUER_VALIDATION_ENABLED: true
        IDAM_SECURITY_ALLOWED_ISSUERS_0: https://idam-web-public.demo.platform.hmcts.net/o
        IDAM_SECURITY_ALLOWED_ISSUERS_1: https://hmcts-access.demo.platform.hmcts.net/o
        IDAM_SECURITY_ALLOWED_ISSUERS_2: https://forgerock-am.service.core-compute-idam-demo.internal:8443/openam/oauth2/realms/root/realms/hmcts
