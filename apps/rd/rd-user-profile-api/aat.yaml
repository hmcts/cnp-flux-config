apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rd-user-profile-api
spec:
  values:
    java:
      environment:
        DUMMY_VAR: true
        SPRING_JPA_OPEN-IN-VIEW: false
        DELETE_ORG: true
        PRD_S2S_AUTHORISED_SERVICES: rd_professional_api,rd_user_profile_api,rd_profile_sync,rd_caseworker_ref_api,iac,et_cos,idam-user-profile-bridge,finrem_case_orchestration,finrem_citizen_ui,pcs_api
        APPLICATION_LOGGING_LEVEL: DEBUG
        FEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 30000
        FEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 30000
        FEIGN_HTTPCLIENT_ENABLED: false
        FEIGN_OKHTTP_ENABLED: true
        IDAM_APACHEHTTPCLIENT_ENABLED: false
        JWT_ISSUER_VALIDATION_ENABLED: true
        IDAM_SECURITY_ALLOWED_ISSUERS_0: https://idam-web-public.aat.platform.hmcts.net/o
        IDAM_SECURITY_ALLOWED_ISSUERS_1: https://hmcts-access.aat.platform.hmcts.net/o
        IDAM_SECURITY_ALLOWED_ISSUERS_2: https://forgerock-am.service.core-compute-idam-aat2.internal:8443/openam/oauth2/realms/root/realms/hmcts
