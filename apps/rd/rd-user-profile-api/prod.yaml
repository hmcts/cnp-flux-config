apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rd-user-profile-api
spec:
  values:
    java:
      replicas: 2
      memoryLimits: "4096Mi"
      memoryRequests: "2048Mi"
      cpuLimits: "4000m"
      cpuRequests: "2000m"
      environment:
        DUMMY_VAR: false
        ROOT_LOGGING_LEVEL: INFO
        DELETE_ORG: true
        IDAM_URL: https://hmcts-access.service.gov.uk
        IDAM_OIDC_URL: https://hmcts-access.service.gov.uk
        OPEN_ID_API_BASE_URI: https://hmcts-access.service.gov.uk/o
        PRD_S2S_AUTHORISED_SERVICES: rd_professional_api,rd_user_profile_api,rd_profile_sync,rd_caseworker_ref_api,idam-user-profile-bridge,et_cos,finrem_case_orchestration,finrem_citizen_ui
        JWT_ISSUER_VALIDATION_ENABLED: true
        IDAM_SECURITY_ALLOWED_ISSUERS_0: https://hmcts-access.service.gov.uk/o
        IDAM_SECURITY_ALLOWED_ISSUERS_1: https://forgerock-am.service.core-compute-idam-prod2.internal:8443/openam/oauth2/realms/root/realms/hmcts
