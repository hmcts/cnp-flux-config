apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rd-user-profile-api
spec:
  releaseName: rd-user-profile-api
  values:
    java:
      autoscaling:
        enabled: true
        maxReplicas: 4
      replicas: 2
      memoryLimits: "4096Mi"
      memoryRequests: "2048Mi"
      cpuLimits: "4000m"
      cpuRequests: "2000m"
      environment:
        DUMMY_VAR: false
        DELETE_ORG: true
        IDAM_URL1: https://idam-api.perftest.platform.hmcts.net
        PRD_S2S_AUTHORISED_SERVICES: rd_professional_api,rd_user_profile_api,rd_profile_sync,rd_caseworker_ref_api,iac,idam-user-profile-bridge,et_cos,finrem_case_orchestration,finrem_citizen_ui,pcs_api
        DUMMY_VAR_TO_RESTART: 0
        JWT_ISSUER_VALIDATION_ENABLED: true
        IDAM_SECURITY_ALLOWED_ISSUERS_0: https://idam-web-public.perftest.platform.hmcts.net/o
        IDAM_SECURITY_ALLOWED_ISSUERS_1: https://hmcts-access.perftest.platform.hmcts.net/o
        IDAM_SECURITY_ALLOWED_ISSUERS_2: https://forgerock-am.service.core-compute-idam-perftest.internal:8443/openam/oauth2/realms/root/realms/hmcts
