apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rd-user-profile-api
spec:
  values:
    java:
      environment:
        DUMMY_VAR: false
        DELETE_ORG: false
        PRD_S2S_AUTHORISED_SERVICES: rd_professional_api,rd_user_profile_api,rd_profile_sync,rd_caseworker_ref_api,idam-user-profile-bridge,et_cos,finrem_case_orchestration,finrem_citizen_ui,pcs_api
        JWT_ISSUER_VALIDATION_ENABLED: true
        IDAM_SECURITY_ALLOWED_ISSUERS_0: https://idam-web-public.ithc.platform.hmcts.net/o
        IDAM_SECURITY_ALLOWED_ISSUERS_1: https://hmcts-access.ithc.platform.hmcts.net/o
        IDAM_SECURITY_ALLOWED_ISSUERS_2: https://forgerock-am.service.core-compute-idam-ithc.internal:8443/openam/oauth2/realms/root/realms/hmcts
