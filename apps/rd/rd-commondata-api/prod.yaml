apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rd-commondata-api
spec:
  values:
    java:
      environment:
        DUMMY_VAR: false
        ROOT_LOGGING_LEVEL: INFO
        DELETE_CWR: false
        OPEN_ID_API_BASE_URI: https://hmcts-access.service.gov.uk/o
        CRD_S2S_AUTHORISED_SERVICES: ccd_data,xui_webapp,sscs,sscs_bulkscan,cui_ra,prl_cos_api,civil_service,iac,sptribs_case_api,et_cos,probate_backend,finrem_case_orchestration,finrem_citizen_ui
        IDAM_URL: https://hmcts-access.service.gov.uk
        JWT_ISSUER_VALIDATION_ENABLED: true
        IDAM_SECURITY_ALLOWED_ISSUERS_0: https://hmcts-access.service.gov.uk/o
        IDAM_SECURITY_ALLOWED_ISSUERS_1: https://forgerock-am.service.core-compute-idam-prod2.internal:8443/openam/oauth2/realms/root/realms/hmcts
