apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../../base/slack-provider/prod
  - ../../../base/docker-registry/prod
  - ../../../rbac/db-query-job-role.yaml
  - ../../../base/automated-db-queries/prod
  - ../../pcs-frontend/pcs-frontend.yaml
  - ../../pcs-api/pcs-api.yaml
  - ../../pcs-bundle-worker/pcs-bundle-worker.yaml
namespace: pcs
patches:
  # Also patches pcs-bundle-worker so it runs with the same image and settings as pcs-api.
  - path: ../../pcs-api/prod.yaml
    target:
      kind: HelmRelease
      name: pcs-api|pcs-bundle-worker
  - path: ../../pcs-frontend/prod.yaml
  - path: ../../serviceaccount/prod.yaml