apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pcs-api
spec:
  values:
    java:
      environment:
        CASE_BUNDLE_ENABLED: "true"
        DOCMOSIS_CONVERT_ENDPOINT: "https://docmosis.aat.platform.hmcts.net/rs/convert"
        HASH_PINS_ENABLED: "false"
        ENABLE_TESTING_SUPPORT: "true"
        PCS_FRONTEND_URL: "https://pcs.aat.platform.hmcts.net"
        BULK_PRINT_SCHEDULE: "FIXED_DELAY|900s"
        BULK_PRINT_LOOKBACK_HOURS: "1"
        SDP_EXPORT_ENABLED: "true"
        SDP_EXPORT_UPLOAD_ENABLED: "true"
