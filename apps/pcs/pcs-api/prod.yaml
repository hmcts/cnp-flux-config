apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pcs-api
spec:
  values:
    java:
      cpuRequests: "500m"
      cpuLimits: "1500m"
      memoryRequests: "2048Mi"
      memoryLimits: "2560Mi"
      environment:
        IDAM_API_URL: https://idam-api.platform.hmcts.net
        PCS_FRONTEND_URL: https://pcs.platform.hmcts.net
        RESPOND_ONLINE_URL: https://pcs.platform.hmcts.net
