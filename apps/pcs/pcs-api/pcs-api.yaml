apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pcs-api
spec:
  releaseName: pcs-api
  values:
    java:
      replicas: 2
      cpuRequests: "500m"
      cpuLimits: "1500m"
      memoryRequests: "2048Mi"
      memoryLimits: "2560Mi"
      image: hmctsprod.azurecr.io/pcs/api:prod-c2ca9c0-20260909094541 #{"$imagepolicy": "flux-system:pcs-api"}
      environment:
        RESTART: "true"
  chart:
    spec:
      chart: ./stable/pcs-api
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
