apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pcs-api
spec:
  values:
    java:
      replicas: 2
      memoryLimits: "2048Mi"
      memoryRequests: "1024Mi"
      cpuLimits: "1500m"
      cpuRequests: "500m"
      image: hmctsprod.azurecr.io/pcs/api:prod-c2ca9c0-20260909094541 #{"$imagepolicy": "flux-system:perftest-pcs-api"}
      environment:
        HASH_PINS_ENABLED: "false"
        ENABLE_TESTING_SUPPORT: "true"
        PCS_FRONTEND_URL: "https://pcs.perftest.platform.hmcts.net"
