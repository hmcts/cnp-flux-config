apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../../rbac/nonprod-role.yaml
  - ../../../rbac/db-query-job-role.yaml
  - ../../pcs-api/pcs-api.yaml
  - ../../pcs-bundle-worker/pcs-bundle-worker.yaml
  - ../../pcs-frontend/pcs-frontend.yaml
namespace: pcs
patches:
  - path: ../../pcs-api/aat.yaml
    target:
      kind: HelmRelease
      name: pcs-api|pcs-bundle-worker
  - patch: |-
      - op: replace
        path: /spec/values/java/environment/ENABLE_TESTING_SUPPORT
        value: "false"
    target:
      kind: HelmRelease
      name: pcs-bundle-worker
  - path: ../../serviceaccount/aat.yaml
  - path: ../../pcs-frontend/aat.yaml
