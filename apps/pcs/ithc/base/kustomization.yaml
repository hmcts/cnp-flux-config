apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../../rbac/nonprod-role.yaml
  - ../../pcs-api/pcs-api.yaml
  - ../../pcs-bundle-worker/pcs-bundle-worker.yaml
  - ../../pcs-frontend/pcs-frontend.yaml
namespace: pcs
patches:
  # Also patches pcs-bundle-worker so it runs with the same image and settings as pcs-api.
  - path: ../../pcs-api/ithc.yaml
    target:
      kind: HelmRelease
      name: pcs-api|pcs-bundle-worker
  - path: ../../serviceaccount/ithc.yaml