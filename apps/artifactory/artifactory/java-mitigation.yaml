apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory-oss
  namespace: artifactory
spec:
  values:
    artifactory:
      # CVE-2026-114938: temporary mitigation for all four Java services until patched JDK images are deployed.
      artifactory:
        extraEnvironmentVariables:
          - name: JDK_JAVA_OPTIONS
            value: "-XX:-UseBASE64Intrinsics"
      access:
        extraEnvironmentVariables:
          - name: JDK_JAVA_OPTIONS
            value: "-XX:-UseBASE64Intrinsics"
      topology:
        extraEnvironmentVariables:
          - name: JDK_JAVA_OPTIONS
            value: "-XX:-UseBASE64Intrinsics"
      jfconfig:
        extraEnvironmentVariables:
          - name: JDK_JAVA_OPTIONS
            value: "-XX:-UseBASE64Intrinsics"
