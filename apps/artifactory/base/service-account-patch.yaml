apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory-oss
  namespace: artifactory
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: artifactory-oss
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: artifactory-oss
              spec:
                template:
                  spec:
                    serviceAccountName: artifactory
                    automountServiceAccountToken: false
          # Chart 107.161.x runs frontend and jfbus as separate Deployments; the AKS
          # policy blocking service-account token automount applies to them too.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: artifactory-oss-(frontend|jfbus)
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: artifactory-oss
              spec:
                template:
                  spec:
                    serviceAccountName: artifactory
                    automountServiceAccountToken: false
