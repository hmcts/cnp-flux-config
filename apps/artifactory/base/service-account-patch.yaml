apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory-oss
  namespace: artifactory
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: artifactory-oss
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: artifactory-oss
              spec:
                template:
                  spec:
                    serviceAccountName: artifactory
                    automountServiceAccountToken: false
