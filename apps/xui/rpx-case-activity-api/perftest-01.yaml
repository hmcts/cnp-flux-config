apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: xui-case-activity-api
spec:
  releaseName: xui-case-activity-api
  values:
    nodejs:
      replicas: 0
      image: hmctsprod.azurecr.io/xui/case-activity-api:pr-39-f4cf78a-20261123165714 #{"$imagepolicy": "flux-system:perftest-rpx-case-activity-api"}
      environment:
        RPX_BASE_URL: http://ccd-data-store-api-perftest.service.core-compute-perftest.internal
        RPX_CASE_ACCESS_CHECK_ENABLED: true
        # Keep tracker keys in one Redis hash slot for MULTI/EXEC transactions.
        REDIS_KEY_PREFIX: "activity:{tracker}:"
        DUMMY_VAR_TO_REDEPLOY: 1
        APPINSIGHTS_SAMPLING_PERCENTAGE: 100
