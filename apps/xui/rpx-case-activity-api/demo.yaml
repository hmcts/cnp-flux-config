apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: xui-case-activity-api
spec:
  releaseName: xui-case-activity-api
  values:
    nodejs:
      replicas: 2
      image: hmctsprod.azurecr.io/xui/case-activity-api:pr-39-732a7a9-20261112131829 #{"$imagepolicy": "flux-system:demo-rpx-case-activity-api"}
      environment:
        RPX_BASE_URL: http://ccd-data-store-api-demo.service.core-compute-demo.internal
        RPX_CASE_ACCESS_CHECK_ENABLED: true
        # Keep tracker keys in one Redis hash slot for MULTI/EXEC transactions.
        REDIS_KEY_PREFIX: "activity:{tracker}:"
        DUMMY_VAR_TO_REDEPLOY: 2
