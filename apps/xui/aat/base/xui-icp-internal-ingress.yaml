apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xui-icp-internal
spec:
  ingressClassName: traefik
  rules:
    - host: xui-icp-aat.service.core-compute-aat.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xui-icp-nodejs
                port:
                  number: 80
