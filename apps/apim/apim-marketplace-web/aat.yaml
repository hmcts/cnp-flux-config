apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apim-marketplace-web
spec:
  values:
    nodejs:
      ingressHost: apim-marketplace-web.aat.platform.hmcts.net
      # No Entra tenant is set up for this environment yet. Sign in is switched off, so the
      # app starts and says sign in is unavailable. Replace with the tenant's keyVaults and
      # workloadClientID (as in sbox.yaml) once external-entra-id has registered the app here.
      environment:
        ENTRA_ENABLED: "false"
