apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amp-marketplace-web
spec:
  values:
    global:
      enableKeyVaults: true
    nodejs:
      ingressHost: amp-marketplace-web.sandbox.platform.hmcts.net
      workloadClientID: "fb098a2c-bb71-46e0-b9f6-46f388f6c970"
      environment:
        # The sandbox egress firewall resets connections to hmcts.github.io, so the default
        # Pages feed never loads. Read the same file from raw.githubusercontent.com instead.
        CATALOGUE_URL: "https://raw.githubusercontent.com/hmcts/amp-catalog/main/docs/apis.json"
      keyVaults:
        amp-marketplace-sbox:
          excludeEnvironmentSuffix: true
          secrets:
            - name: marketplace-web-redis-host
              alias: REDIS_HOST
            - name: marketplace-web-redis-port
              alias: REDIS_PORT
            - name: marketplace-web-redis-access-key
              alias: REDIS_KEY
            - name: marketplace-web-session-secret
              alias: SESSION_SECRET
        # Entra sign-in credentials, managed and rotated by hmcts/external-entra-id
        kvspsextidsbox:
          excludeEnvironmentSuffix: true
          secrets:
            - name: entra-app-web-api-marketplace-client-id
              alias: ENTRA_CLIENT_ID
            - name: entra-app-web-api-marketplace-secret
              alias: ENTRA_CLIENT_SECRET
            - name: entra-tenant-id
              alias: ENTRA_TENANT_ID
