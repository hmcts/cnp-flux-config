apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amp-marketplace
spec:
  values:
    global:
      enableKeyVaults: true
    java:
      ingressHost: amp-marketplace.platform.hmcts.net
      workloadClientID: "15737775-923e-4090-9819-6d9180d303fb"
      environment:
        ENVIRONMENT_NAME: PROD
        AZURE_TENANT_ID: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
        APIM_SUBSCRIPTION_ID: "890625e2-7a8b-445c-81b4-8044a062cef3" # DTS-SPS-PROD
        APIM_RESOURCE_GROUP: "rg-sps-platform-prod"
        APIM_SERVICE_NAME: "sps-api-mgmt-prod"
        # No resource app is registered in the prod directory yet. Blank refuses a grant for
        # that API with a 503; the chart default is a sandbox app id.
        ENTRA_RESOURCE_APP_ID_SLC: ""
        ENTRA_RESOURCE_APP_ID_RCC: ""
        ENTRA_RESOURCE_APP_ID_PCD: ""
        ENTRA_RESOURCE_APP_ID_DL: ""
      keyVaults:
        amp-marketplace:
          secrets:
            - name: marketplace-POSTGRES-USER
              alias: POSTGRES_USER
            - name: marketplace-POSTGRES-PASS
              alias: POSTGRES_PASS
            - name: marketplace-POSTGRES-HOST
              alias: POSTGRES_HOST
            - name: marketplace-POSTGRES-PORT
              alias: POSTGRES_PORT
            - name: marketplace-POSTGRES-DATABASE
              alias: POSTGRES_DATABASE
            - name: marketplace-NOTIFY-API-KEY
              alias: NOTIFY_API_KEY
        # Entra onboarding credentials (amp-client-onboarding), managed and rotated by hmcts/external-entra-id
        kvspsextidprod:
          excludeEnvironmentSuffix: true
          secrets:
            - name: entra-app-amp-client-onboarding-client-id
              alias: ENTRA_ONBOARDING_CLIENT_ID
            - name: entra-app-amp-client-onboarding-secret
              alias: ENTRA_ONBOARDING_CLIENT_SECRET
            - name: entra-tenant-id
              alias: ENTRA_TENANT_ID
