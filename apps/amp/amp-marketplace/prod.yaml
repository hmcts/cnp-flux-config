apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amp-marketplace
spec:
  values:
    global:
      enableKeyVaults: true
    java:
      ingressHost: amp-marketplace.platform.hmcts.net
      workloadClientID: "15737775-923e-4090-9819-6d9180d303fb"
      environment:
        AZURE_TENANT_ID: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
        APIM_SUBSCRIPTION_ID: "890625e2-7a8b-445c-81b4-8044a062cef3" # DTS-SPS-PROD
        APIM_RESOURCE_GROUP: "rg-sps-platform-prod"
        APIM_SERVICE_NAME: "sps-api-mgmt-prod"
        # Notify has no CC, so each address gets its own copy.
        NOTIFY_REVIEW_INBOXES: DataAccessPanel@justice.gov.uk,Craig.Robb@justice.gov.uk,APIMarketplace@hmcts.net
      keyVaults:
        amp-marketplace:
          secrets:
            - name: marketplace-POSTGRES-USER
              alias: POSTGRES_USER
            - name: marketplace-POSTGRES-PASS
              alias: POSTGRES_PASS
            - name: marketplace-POSTGRES-HOST
              alias: POSTGRES_HOST
            - name: marketplace-POSTGRES-PORT
              alias: POSTGRES_PORT
            - name: marketplace-POSTGRES-DATABASE
              alias: POSTGRES_DATABASE
            - name: marketplace-NOTIFY-API-KEY
              alias: NOTIFY_API_KEY
      # ENTRA_RESOURCE_APP_ID_SLC/RCC and the Entra onboarding credentials are deliberately
      # absent: sbox and demo read them from kvspsextidsbox and kvspsextidaat, and the prod
      # directory has neither the resource apps nor a vault to read them from yet. Listing a
      # secret the vault does not hold leaves the pod in Init rather than disabling the feature.
