apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amp-marketplace
spec:
  values:
    java:
      ingressHost: amp-marketplace.aat.platform.hmcts.net
      # amp-aat-mi (managed-identities-aat-rg), which holds the subscription-manager role on sps-api-mgmt-aat
      workloadClientID: "d422f9a5-7562-44ba-9098-fd5043170103"
      environment:
        AZURE_TENANT_ID: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
        APIM_SUBSCRIPTION_ID: "70bea6e3-384f-4cf4-b551-743a78d716cd" # DTS-SPS-STG
        APIM_RESOURCE_GROUP: "rg-sps-platform-aat"
        APIM_SERVICE_NAME: "sps-api-mgmt-aat"
      keyVaults:
        amp-marketplace:
          secrets:
            - name: marketplace-POSTGRES-USER
              alias: POSTGRES_USER
            - name: marketplace-POSTGRES-PASS
              alias: POSTGRES_PASS
            - name: marketplace-POSTGRES-HOST
              alias: POSTGRES_HOST
            - name: marketplace-POSTGRES-PORT
              alias: POSTGRES_PORT
            - name: marketplace-POSTGRES-DATABASE
              alias: POSTGRES_DATABASE
