apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amp-marketplace
spec:
  values:
    java:
      ingressHost: amp-marketplace.aat.platform.hmcts.net
      # amp-aat-mi (managed-identities-aat-rg), which holds the subscription-manager role on sps-api-mgmt-aat
      workloadClientID: "d422f9a5-7562-44ba-9098-fd5043170103"
      environment:
        ENVIRONMENT_NAME: AAT
        APPLICATIONINSIGHTS_ENABLED: "true"
        APPLICATIONINSIGHTS_CONFIGURATION_FILE: /mnt/secrets/amp-marketplace/app-insights-config
        # Audit entries go to the AmpAudit_CL table instead of AppTraces (service-api-marketplace docs/AUDIT.md)
        AUDIT_INGESTION_ENABLED: "true"
        AZURE_TENANT_ID: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
        APIM_SUBSCRIPTION_ID: "70bea6e3-384f-4cf4-b551-743a78d716cd" # DTS-SPS-STG
        APIM_RESOURCE_GROUP: "rg-sps-platform-aat"
        APIM_SERVICE_NAME: "sps-api-mgmt-aat"
        DEVELOPER_PORTAL_URL: "https://amp-portal.aat.api.hmcts.net"
        # Resource apps in the stg External ID tenant, which AAT shares with demo
        ENTRA_RESOURCE_APP_ID_SLC: "02b04e09-4f7b-4724-963b-a4c10a6825f2"
        ENTRA_RESOURCE_APP_ID_RCC: "640c325d-5a0e-48ce-a616-710d0785f2cb"
        ENTRA_RESOURCE_APP_ID_PCD: "bb45396e-c703-4afc-b6c9-05aa1fe18dba"
        ENTRA_RESOURCE_APP_ID_DL: "f78066dd-0406-465b-9d9e-6073f5f8925b"
      keyVaults:
        amp-marketplace:
          secrets:
            - name: marketplace-POSTGRES-USER
              alias: POSTGRES_USER
            - name: marketplace-POSTGRES-PASS
              alias: POSTGRES_PASS
            - name: marketplace-POSTGRES-HOST
              alias: POSTGRES_HOST
            - name: marketplace-POSTGRES-PORT
              alias: POSTGRES_PORT
            - name: marketplace-POSTGRES-DATABASE
              alias: POSTGRES_DATABASE
            - name: app-insights-config
            - name: audit-ingestion-endpoint
              alias: AUDIT_INGESTION_ENDPOINT
            - name: audit-ingestion-rule-id
              alias: AUDIT_INGESTION_RULE_ID
        # Admin sign-in (/admin/**) and the amp-client-onboarding credentials that register consumers'
        # applications, managed by hmcts/external-entra-id
        kvspsextidaat:
          excludeEnvironmentSuffix: true
          secrets:
            - name: entra-app-amp-client-onboarding-client-id
              alias: ENTRA_ONBOARDING_CLIENT_ID
            - name: entra-app-amp-client-onboarding-secret
              alias: ENTRA_ONBOARDING_CLIENT_SECRET
            - name: entra-tenant-id
              alias: ENTRA_TENANT_ID
            - name: entra-app-web-api-marketplace-client-id
              alias: ADMIN_AUTH_AUDIENCE
