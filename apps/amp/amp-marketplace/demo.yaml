apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amp-marketplace
spec:
  values:
    java:
      ingressHost: amp-marketplace.demo.platform.hmcts.net
      workloadClientID: "93a8757c-08f3-450c-85c3-79e703114da2"
      environment:
        AZURE_TENANT_ID: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
        APIM_SUBSCRIPTION_ID: "058bf954-ac1f-462b-bca4-42a30314bd74" # DTS-SPS-DEMO
        APIM_RESOURCE_GROUP: "rg-sps-platform-demo"
        APIM_SERVICE_NAME: "sps-api-mgmt-demo"
      keyVaults:
        amp-marketplace:
          secrets:
            - name: marketplace-POSTGRES-USER
              alias: POSTGRES_USER
            - name: marketplace-POSTGRES-PASS
              alias: POSTGRES_PASS
            - name: marketplace-POSTGRES-HOST
              alias: POSTGRES_HOST
            - name: marketplace-POSTGRES-PORT
              alias: POSTGRES_PORT
            - name: marketplace-POSTGRES-DATABASE
              alias: POSTGRES_DATABASE
        # Entra onboarding credentials (amp-client-onboarding), managed and rotated by hmcts/external-entra-id
        kvspsextidaat:
          excludeEnvironmentSuffix: true
          secrets:
            - name: entra-app-amp-client-onboarding-client-id
              alias: ENTRA_ONBOARDING_CLIENT_ID
            - name: entra-app-amp-client-onboarding-secret
              alias: ENTRA_ONBOARDING_CLIENT_SECRET
            - name: entra-tenant-id
              alias: ENTRA_TENANT_ID
