apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amp-try-it-now
spec:
  values:
    global:
      enableKeyVaults: true
    java:
      ingressHost: amp-try-it-now.sandbox.platform.hmcts.net
      environment:
        APPLICATIONINSIGHTS_ENABLED: "false"
        APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=00000000-0000-0000-0000-000000000000"
        # SELF_ISSUED for the first deploy, and this is a real constraint rather than a shortcut.
        #
        # Under ENTRA the registry resolves a per-API audience from AUTH_AUDIENCE_<CODE> and FAILS
        # STARTUP if any registered API has none - a blank audience would accept a token minted for
        # any resource. slc has one (amp-api-try-slc, c4c8974c-...); rcc has no Try It Now resource
        # app yet, so ENTRA would crash-loop the pod.
        #
        # To move sandbox to ENTRA: register amp-api-try-rcc in external-entra-id, then set
        # AUTH_KEY_SOURCE, AUTH_TENANT_ID, AUTH_ISSUER and one AUTH_AUDIENCE_<CODE> per API.
        AUTH_KEY_SOURCE: "SELF_ISSUED"
      keyVaults:
        amp-try-it-now-sbox:
          excludeEnvironmentSuffix: true
          secrets:
            - name: try-it-now-POSTGRES-USER
              alias: POSTGRES_USER
            - name: try-it-now-POSTGRES-PASS
              alias: POSTGRES_PASS
            - name: try-it-now-POSTGRES-HOST
              alias: POSTGRES_HOST
            - name: try-it-now-POSTGRES-PORT
              alias: POSTGRES_PORT
            - name: try-it-now-POSTGRES-DATABASE
              alias: POSTGRES_DATABASE
