apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amp-try-it-now
spec:
  values:
    global:
      enableKeyVaults: true
    java:
      ingressHost: amp-try-it-now.demo.platform.hmcts.net
      environment:
        APPLICATIONINSIGHTS_ENABLED: "false"
        APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=00000000-0000-0000-0000-000000000000"
        # Every audience has to be set together: ApiRegistry reads one AUTH_AUDIENCE_<CODE> per
        # registered API and fails startup on a blank one rather than widen what it trusts.
        # AUTH_ISSUER and AUTH_JWKS_URI are deliberately absent - AuthProperties derives both from
        # the tenant, on login.microsoftonline.com rather than ciamlogin.com.
        AUTH_KEY_SOURCE: "ENTRA"
        AUTH_TENANT_ID: "db827888-77df-4707-b3d9-24a3dfe32889"
        AUTH_AUDIENCE_SLC: "02b04e09-4f7b-4724-963b-a4c10a6825f2"
        AUTH_AUDIENCE_RCC: "640c325d-5a0e-48ce-a616-710d0785f2cb"
        AUTH_AUDIENCE_PCD: "bb45396e-c703-4afc-b6c9-05aa1fe18dba"
        AUTH_AUDIENCE_DL: "f78066dd-0406-465b-9d9e-6073f5f8925b"
      keyVaults:
        amp-try-it-now:
          secrets:
            - name: try-it-now-POSTGRES-USER
              alias: POSTGRES_USER
            - name: try-it-now-POSTGRES-PASS
              alias: POSTGRES_PASS
            - name: try-it-now-POSTGRES-HOST
              alias: POSTGRES_HOST
            - name: try-it-now-POSTGRES-PORT
              alias: POSTGRES_PORT
            - name: try-it-now-POSTGRES-DATABASE
              alias: POSTGRES_DATABASE
