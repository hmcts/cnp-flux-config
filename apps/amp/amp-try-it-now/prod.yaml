apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amp-try-it-now
spec:
  values:
    global:
      enableKeyVaults: true
    java:
      ingressHost: amp-try-it-now.platform.hmcts.net
      workloadClientID: "15737775-923e-4090-9819-6d9180d303fb"
      environment:
        APPLICATIONINSIGHTS_ENABLED: "false"
        APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=00000000-0000-0000-0000-000000000000"
        AUTH_KEY_SOURCE: "ENTRA"
        AUTH_TENANT_ID: "0d0315f6-3c04-4edb-ac37-b05f580cc122"
        AUTH_AUDIENCE_SLC: "cabebf93-f8bd-42c1-9fd2-0fff1bd13177"
        AUTH_AUDIENCE_RCC: "38852e1f-a8b9-463f-bb9e-73e9c166a1ae"
        AUTH_AUDIENCE_PCD: "d9478881-b17f-40ef-a1b3-57728323430c"
        AUTH_AUDIENCE_DL: "7bffe402-e979-443e-8703-7b5a4e90d5c0"
      keyVaults:
        amp-try-it-now:
          secrets:
            - name: try-it-now-POSTGRES-USER
              alias: POSTGRES_USER
            - name: try-it-now-POSTGRES-PASS
              alias: POSTGRES_PASS
            - name: try-it-now-POSTGRES-HOST
              alias: POSTGRES_HOST
            - name: try-it-now-POSTGRES-PORT
              alias: POSTGRES_PORT
            - name: try-it-now-POSTGRES-DATABASE
              alias: POSTGRES_DATABASE
