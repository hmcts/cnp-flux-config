apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik2
  namespace: admin
spec:
  chart:
    spec:
      version: 42.0.0
  values:
    image:
      tag: v3.7.15
    logs:
      $patch: delete
    accessLog:
      enabled: true
    service:
      spec:
        loadBalancerIP: "10.101.159.250"
    deployment:
      podLabels:
        useWorkloadIdentity: "true"
    serviceAccount:
      name: admin