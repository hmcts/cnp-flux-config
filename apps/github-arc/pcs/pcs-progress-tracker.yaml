apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pcs-progress-tracker
  namespace: github-arc
  annotations:
    # ARC charts use a strict values schema and do not understand the shared
    # java/nodejs/job/global default values that the cluster base patch injects.
    hmcts.github.com/kustomize-defaults: disabled
spec:
  releaseName: pcs-progress-tracker
  interval: 5m
  # The runner scale set CRDs (AutoscalingRunnerSet) are owned by the controller,
  # so the controller release must reconcile first.
  dependsOn:
    - name: arc-controller
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: github-arc
  values:
    # Repository these runners serve. Its scheduled QA readiness report reads the Jenkins API
    # (build.hmcts.net), which only resolves and routes from inside the HMCTS network, so this
    # scale set runs on ptl-intsvc only. Workflows target it with `runs-on: pcs-progress-tracker`.
    githubConfigUrl: "https://github.com/hmcts/pcs-private-landlord-progress-tracker"
    # Pre-created Kubernetes secret holding the GitHub App credentials
    # (github_app_id, github_app_installation_id, github_app_private_key).
    # Created manually in the github-arc namespace - not stored in git.
    githubConfigSecret: github-arc-app
    runnerScaleSetName: pcs-progress-tracker
    # One weekday run; scale to zero when idle.
    minRunners: 0
    maxRunners: 1
