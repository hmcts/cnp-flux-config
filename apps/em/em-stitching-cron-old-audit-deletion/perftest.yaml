apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: em-stitching-cron-old-audit-deletion
spec:
  releaseName: em-stitching-cron-old-audit-deletion
  values:
    job:
      applicationPort: 8095
      schedule: "*/15 17,18 * * *"
      environment:
        HISTORIC_AUDIT_NO_OF_RECORDS: 500
        HISTORIC_AUDIT_NO_OF_RETENTION_DAYS: 180
    global:
      environment: perftest
