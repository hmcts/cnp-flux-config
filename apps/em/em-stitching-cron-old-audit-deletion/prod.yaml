apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: em-stitching-cron-old-audit-deletion
spec:
  releaseName: em-stitching-cron-old-audit-deletion
  values:
    job:
      applicationPort: 8095
      schedule: "*/5 1-2 * * *"
      environment:
        IDAM_WEB_API_BASE_URI: https://hmcts-access.service.gov.uk
        OPEN_ID_API_BASE_URI: https://hmcts-access.service.gov.uk/o
        APPLICATIONINSIGHTS_INSTRUMENTATION_LOGGING_LEVEL: INFO
        HISTORIC_AUDIT_NO_OF_RETENTION_DAYS: 180
        HISTORIC_AUDIT_NO_OF_RECORDS: 10000
    global:
      environment: prod
