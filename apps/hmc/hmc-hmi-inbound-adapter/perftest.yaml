apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hmc-hmi-inbound-adapter
spec:
  values:
    java:
      environment:
        DUMMY_VAR: 0
      replicas: 2
      autoscaling:
        enabled: true
        maxReplicas: 4
        memory:
          enabled: true
          averageUtilization: 85
      memoryRequests: "1000Mi"
      cpuRequests: "100m"
