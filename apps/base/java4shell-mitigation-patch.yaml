# CVE-2026-114938 (Java4Shell): disables the HotSpot Base64 intrinsic until patched JDK images are deployed.
- op: add
  path: /spec/patches/-
  value:
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: placeholder
      spec:
        values:
          java:
            environment:
              JDK_JAVA_OPTIONS: "-XX:-UseBASE64Intrinsics"
          job:
            environment:
              JDK_JAVA_OPTIONS: "-XX:-UseBASE64Intrinsics"
    target:
      kind: HelmRelease
      annotationSelector: hmcts.github.com/kustomize-defaults != disabled
