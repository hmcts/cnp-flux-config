apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plum-fastapi-backend
spec:
  values:
    global:
      enableKeyVaults: true
    python:
      ingressHost: plum-fastapi-backend-sandbox.service.core-compute-sandbox.internal
      image: hmctssbox.azurecr.io/plum/fastapi-backend:prod-5be089d-20260828083004 # {"$imagepolicy": "flux-system:plum-fastapi-backend-sbox"}
      workloadClientID: ${WORKLOAD_IDENTITY_ID}
      keyVaults:
        plumsi:
          secrets:
            - name: appinsights-connection-string
        sps-ai-kv-sbox:
          excludeEnvironmentSuffix: true
          secrets:
            - name: apim-subscription-cnp-plum-fastapi
            - name: apim-subscription-cnp-plum-frontend
            # Revert this block, AI_GATEWAY_MODEL and AI_GATEWAY_SUBSCRIPTION_KEY_FILE once the BYO path is confirmed.
            - name: apim-subscription-crumble-chat
      environment:
        RECIPES_SERVICE_URL: http://plum-recipe-backend-java
        APPLICATIONINSIGHTS_CONNECTION_STRING_FILE: /mnt/secrets/plumsi/appinsights-connection-string
        AI_GATEWAY_URL: https://ai-gateway.sandbox.platform.hmcts.net/ai/platform/v1/chat/completions
        AI_GATEWAY_SCOPE: api://b3bfa0f5-faa5-4d10-bba0-e284144aea89/.default
        AI_GATEWAY_MODEL: gpt-4o
        AI_GATEWAY_SUBSCRIPTION_KEY_FILE: /mnt/secrets/sps-ai-kv-sbox/apim-subscription-crumble-chat
        AI_GATEWAY_SUBSCRIPTION_KEY_FRONTEND_FILE: /mnt/secrets/sps-ai-kv-sbox/apim-subscription-cnp-plum-frontend
