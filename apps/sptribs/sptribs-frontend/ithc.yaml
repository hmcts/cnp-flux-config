apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sptribs-frontend
spec:
  values:
    nodejs:
      image: hmctsprod.azurecr.io/sptribs/frontend:prod-812cf6a-20261111101642 #{"$imagepolicy": "flux-system:ithc-sptribs-frontend"}
      environment:
        PCQ_ENABLED: false
        IDAM_API_URL: https://idam-web-public.ithc.platform.hmcts.net/o/token
        IDAM_WEB_URL: https://idam-web-public.ithc.platform.hmcts.net/o/authorize
        IDAM_HMCTS_URL: https://hmcts-access.ithc.platform.hmcts.net
        REDIS_HOST: 'sptribs-frontend-ithc.uksouth.redis.azure.net'
        REDIS_PORT: '10000'
      keyVaults:
        sptribs:
          secrets:
            - idam-ui-secret
            - idam-systemupdate-username
            - idam-systemupdate-password
            - name: redis-new
              alias: redis-access-key
            - s2s-case-api-secret
            - app-insights-connection-string
            - postcode-lookup-token
            - specialTribunals-cic-pcq-token
            - sptribs-frontend-dynatrace-url
