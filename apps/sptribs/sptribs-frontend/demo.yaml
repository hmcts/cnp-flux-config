apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sptribs-frontend
spec:
  values:
    nodejs:
      image: hmctsprod.azurecr.io/sptribs/frontend:prod-b183acc-20261111134356 #{"$imagepolicy": "flux-system:demo-sptribs-frontend"}
      environment:
        PCQ_ENABLED: false
        RATE_LIMITER_DISABLED: true
        #        IDAM_API_URL: https://idam-api.demo.platform.hmcts.net/o/token
        #        IDAM_WEB_URL: https://idam-web-public.demo.platform.hmcts.net/login
        REDIS_HOST: 'sptribs-frontend-demo.uksouth.redis.azure.net'
        REDIS_PORT: '10000'
      keyVaults:
        sptribs:
          secrets:
            - idam-ui-secret
            - idam-systemupdate-username
            - idam-systemupdate-password
            - name: redis-new
              alias: redis-access-key
            - s2s-case-api-secret
            - app-insights-connection-string
            - postcode-lookup-token
            - specialTribunals-cic-pcq-token
            - sptribs-frontend-dynatrace-url
