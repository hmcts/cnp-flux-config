apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sptribs-frontend
spec:
  values:
    nodejs:
      image: hmctsprod.azurecr.io/sptribs/frontend:prod-d286fd2-20261111130800 #{"$imagepolicy": "flux-system:perftest-sptribs-frontend"}
      environment:
        PCQ_ENABLED: false
        REDIS_HOST: 'sptribs-frontend-perftest.uksouth.redis.azure.net'
        REDIS_PORT: '10000'
      keyVaults:
        sptribs:
          secrets:
            - idam-ui-secret
            - idam-systemupdate-username
            - idam-systemupdate-password
            - name: redis-new
              alias: redis-access-key
            - s2s-case-api-secret
            - app-insights-connection-string
            - postcode-lookup-token
            - specialTribunals-cic-pcq-token
            - sptribs-frontend-dynatrace-url
