apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sptribs-frontend
spec:
  values:
    nodejs:
      environment:
        PCQ_ENABLED: true
        DUMMY_ENV_VAR: false
        REDIS_HOST: 'sptribs-frontend-aat.uksouth.redis.azure.net'
        REDIS_PORT: '10000'
      keyVaults:
        sptribs:
          secrets:
            - idam-ui-secret
            - idam-systemupdate-username
            - idam-systemupdate-password
            - name: redis-new
              alias: redis-access-key
            - s2s-case-api-secret
            - app-insights-connection-string
            - postcode-lookup-token
            - specialTribunals-cic-pcq-token
            - sptribs-frontend-dynatrace-url
