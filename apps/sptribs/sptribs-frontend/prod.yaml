apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sptribs-frontend
spec:
  values:
    nodejs:
      keyVaults:
        sptribs:
          secrets:
            - idam-ui-secret
            - idam-systemupdate-username
            - idam-systemupdate-password
            - name: redis-new
              alias: redis-access-key
            - s2s-case-api-secret
            - app-insights-connection-string
            - postcode-lookup-token
            - specialTribunals-cic-pcq-token
            - sptribs-frontend-dynatrace-url
      ingressHost: special-tribunals.service.gov.uk
      spotInstances:
        enabled: false
      environment:
        REDIS_HOST: 'sptribs-frontend-prod.uksouth.redis.azure.net'
        REDIS_PORT: '10000'
        PCQ_ENABLED: true
        EQUALITY_URL: https://equality-and-diversity.platform.hmcts.net
        IDAM_API_URL: https://hmcts-access.service.gov.uk/o/token
        IDAM_WEB_URL: https://hmcts-access.service.gov.uk/o/authorize
        IDAM_END_SESSION_URL: https://hmcts-access.service.gov.uk/o/endSession
        DSS_UPDATE_URL: https://update.special-tribunals.service.gov.uk
        REDEPLOY: now
