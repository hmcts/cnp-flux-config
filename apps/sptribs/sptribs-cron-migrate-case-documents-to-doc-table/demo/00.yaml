apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sptribs-cron-migrate-case-documents-to-doc-table
spec:
  values:
    job:
      schedule: "0 12 * * *"
      environment:
        MIGRATE_CASE_DOCUMENTS_TO_TABLE_TEST_CASE_REF:
        MIGRATE_CASE_DOCUMENTS_TO_TABLE_ENABLED: false
        MIGRATE_CASE_DOCUMENTS_TO_TABLE_BATCH_SIZE: 100
        MIGRATE_CASE_DOCUMENTS_TO_TABLE_BATCH_PAUSE: 5000
    global:
      jobKind: CronJob
      enableKeyVaults: true
      tenantId: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
      environment: demo
