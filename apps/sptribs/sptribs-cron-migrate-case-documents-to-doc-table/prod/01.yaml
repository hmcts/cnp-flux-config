apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sptribs-cron-migrate-case-documents-to-doc-table
spec:
  values:
    job:
      schedule: "45 12 * * *"
      environment:
        MIGRATE_CASE_DOCUMENTS_TO_TABLE_TEST_CASE_REF: "1708950485927700,1719393611922732,1721823448231945,1724233842853657,1734015291046042"
        MIGRATE_CASE_DOCUMENTS_TO_TABLE_ENABLED: true
        MIGRATE_CASE_DOCUMENTS_TO_TABLE_BATCH_SIZE: 100
        MIGRATE_CASE_DOCUMENTS_TO_TABLE_BATCH_PAUSE: 5000
        IDAM_API_BASEURL: https://idam-api.platform.hmcts.net
    global:
      jobKind: CronJob
      enableKeyVaults: true
      tenantId: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
      environment: prod
