apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sptribs-cron-remove-first-hearing-date
  namespace: sptribs
spec:
  releaseName: sptribs-cron-remove-first-hearing-date
  interval: 5m
  values:
    global:
      environment: demo
      enableKeyVaults: true
      jobKind: CronJob
    job:
      image: hmctsprod.azurecr.io/sptribs/case-api:pr-2696-1b2b8e4-20261112094835
      suspend: false
      schedule: "0 12 * * *"
      concurrencyPolicy: Forbid
      backoffLimit: 1
      restartPolicy: Never
      keyVaults:
        sptribs:
          secrets:
            - name: app-insights-instrumentation-key
            - name: app-insights-connection-string
            - name: uk-gov-notify-api-key
              alias: UK_GOV_NOTIFY_API_KEY_1
            - name: s2s-case-api-secret
              alias: S2S_SECRET
            - name: idam-secret
              alias: IDAM_CLIENT_SECRET
            - name: launchdarkly-sdk-key
              alias: LAUNCH_DARKLY_SDK_KEY
            - name: idam-systemupdate-username
              alias: IDAM_SYSTEM_UPDATE_USERNAME
            - name: idam-systemupdate-password
              alias: IDAM_SYSTEM_UPDATE_PASSWORD
            - name: ccd-case-events-sendonly-connection-string
              alias: AZURE_SERVICE_BUS_CONNECTION_STRING
            - name: sptribs-POSTGRES-HOST
              alias: POSTGRES_HOST
            - name: sptribs-POSTGRES-PORT
              alias: POSTGRES_PORT
            - name: sptribs-POSTGRES-DATABASE
              alias: POSTGRES_NAME
            - name: sptribs-POSTGRES-USER
              alias: POSTGRES_USERNAME
            - name: sptribs-POSTGRES-PASS
              alias: POSTGRES_PASSWORD
      environment:
        TASK_NAME: SystemRemoveFirstHearingDateTask
        REMOVE_FIRST_HEARING_DATE_ENABLED: "true"
        REMOVE_FIRST_HEARING_DATE_BATCH_SIZE: "100"
        REMOVE_FIRST_HEARING_DATE_BATCH_PAUSE_MS: "5000"
        SPRING_JMS_SERVICEBUS_ENABLED: "false"
        SPTRIBS_SERVICEBUS_SCHEDULER_ENABLED: "false"
        IDAM_API_BASEURL: https://idam-web-public.demo.platform.hmcts.net
        SPRING_APPLICATION_JSON: |
          {
            "ccd": {
              "decentralised-runtime": {
                "system-user": {
                  "id": "sptribs-demo-system-migration",
                  "username": "sptribs-demo-system-migration",
                  "first-name": "Demo",
                  "last-name": "System Migration"
                }
              }
            }
          }
  chart:
    spec:
      chart: sptribs-cron
      version: 1.0.10
      sourceRef:
        kind: HelmRepository
        name: hmctspublic
        namespace: flux-system
      interval: 1m
