apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: azure-devops-agent-windows
  namespace: azure-devops
spec:
  releaseName: azure-devops-agent-windows
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ScaledJob
              name: azure-devops-agent-windows-function
            patch: |
              - op: add
                path: /spec/jobTargetRef/template/spec/securityContext
                value:
                  windowsOptions:
                    runAsUserName: ContainerUser
              # Guard the pinned chart workaround so future populated fields are not removed.
              - op: test
                path: /spec/jobTargetRef/template/metadata/annotations
                value: null
              - op: remove
                path: /spec/jobTargetRef/template/metadata/annotations
              - op: test
                path: /spec/jobTargetRef/template/spec/volumes
                value: null
              - op: remove
                path: /spec/jobTargetRef/template/spec/volumes
              - op: test
                path: /spec/jobTargetRef/template/spec/containers/0/volumeMounts
                value: null
              - op: remove
                path: /spec/jobTargetRef/template/spec/containers/0/volumeMounts
              # Chart 2.5.3 incorrectly copies rollout.strategy into propagationPolicy.
              - op: test
                path: /spec/rollout/propagationPolicy
                value: gradual
              - op: replace
                path: /spec/rollout/propagationPolicy
                value: background
  values:
    scaleType: Job
    image: hmctsprod.azurecr.io/azure-devops-agent-windows:prod-fcc24e75-1783430255 # {"$imagepolicy": "flux-system:azure-devops-agent-windows"}
    runAsRoot: true
    tolerations:
      - key: kubernetes.io/os
        operator: Equal
        value: windows
        effect: NoSchedule
    nodeSelector:
      kubernetes.io/os: windows
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - jenkins-master
            topologyKey: "kubernetes.io/hostname"
    environment:
      AZP_URL: https://dev.azure.com/hmcts
      CMD_ARGS: "--once"
      AZP_POOL: hmcts-cft-ptlsbox-windows
    job:
      activeDeadlineSeconds: 10800
    memoryRequests: 512Mi
    cpuRequests: 25m
    memoryLimits: 3Gi
    cpuLimits: 2
    maxReplicaCount: 3
    successfulJobsHistoryLimit: 5
    failedJobsHistoryLimit: 5
  chart:
    spec:
      chart: function
      version: 2.5.3
      sourceRef:
        kind: HelmRepository
        name: hmctspublic
        namespace: flux-system
