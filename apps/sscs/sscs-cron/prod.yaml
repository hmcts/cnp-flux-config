apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sscs-cron
  namespace: sscs
spec:
  values:
    global:
      jobKind: CronJob
      enableKeyVaults: true
    job:
      enabled: true
      schedule: "00 20 03 11 *"
      environment:
        TASK_NAME: ResendHearingBookedTask