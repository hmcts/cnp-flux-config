apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sscs-cron
  namespace: sscs
spec:
  values:
    global:
      jobKind: CronJob
      enableKeyVaults: true
    job:
      enabled: false
      schedule: "50 10 04 11 *"
      image: hmctsprod.azurecr.io/sscs/tribunals-api:prod-6890d13-20261103142801
      environment:
        IDAM_API_URL: https://idam-api.platform.hmcts.net
        IDAM_OIDC_URL: https://hmcts-access.service.gov.uk
        IDAM_API_JWK_URL: https://idam-api.platform.hmcts.net/jwks
        IDAM_OIDC_JWK_URL: https://hmcts-access.service.gov.uk/o/jwks
        IDAM_URL: https://idam-api.platform.hmcts.net
