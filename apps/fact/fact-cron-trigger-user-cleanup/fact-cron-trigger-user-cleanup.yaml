apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fact-cron-trigger-user-cleanup
spec:
  releaseName: fact-cron-trigger-user-cleanup
  values:
    job:
      useInterpodAntiAffinity: true
      image: hmctsprod.azurecr.io/fact/cron-trigger:prod-6a930df-20260810122240 #{"$imagepolicy": "flux-system:fact-cron-trigger-user-cleanup"}
      schedule: "0 9 * * 1-5"
      environment:
        TRIGGER_TYPE: USER_CLEANUP
        TRIGGER_ENABLED: true
  chart:
    spec:
      chart: ./stable/fact-cron-trigger
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 5m
