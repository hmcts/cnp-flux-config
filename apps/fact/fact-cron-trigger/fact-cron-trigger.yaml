apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fact-cron-trigger
spec:
  releaseName: fact-cron-trigger
  values:
    job:
      useInterpodAntiAffinity: true
      image: hmctsprod.azurecr.io/fact/cron-trigger:prod-c2b1d86-20260731132338 #{"$imagepolicy": "flux-system:fact-cron-trigger"}
      schedule: "*/40 * * * *"
      environment:
        TRIGGER_TYPE: CSV
        TRIGGER_ENABLED: true
        FACT_API_URL: http://fact-api-${ENVIRONMENT}.service.core-compute-${ENVIRONMENT}.internal
  chart:
    spec:
      chart: ./stable/fact-cron-trigger
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 5m
