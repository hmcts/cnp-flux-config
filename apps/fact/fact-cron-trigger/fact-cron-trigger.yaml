apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fact-cron-trigger
spec:
  releaseName: fact-cron-trigger
  values:
    job:
      useInterpodAntiAffinity: true
      image: hmctsprod.azurecr.io/fact/cron-trigger:prod-6a930df-20260810122240 #{"$imagepolicy": "flux-system:fact-cron-trigger"}
      schedule: "0 9 * * 1-5"
      environment:
        TRIGGER_TYPE: CSV
        TRIGGER_ENABLED: true
        FACT_API_URL: http://fact-api-${ENVIRONMENT}.service.core-compute-${ENVIRONMENT}.internal
  chart:
    spec:
      chart: ./stable/fact-cron-trigger
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 5m
