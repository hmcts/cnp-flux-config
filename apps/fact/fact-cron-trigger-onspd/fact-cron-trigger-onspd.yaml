apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fact-cron-trigger-onspd
spec:
  releaseName: fact-cron-trigger-onspd
  values:
    job:
      useInterpodAntiAffinity: true
      image: hmctsprod.azurecr.io/fact/cron-trigger:prod-63ac0e2-20261030100332 # {"$imagepolicy": "flux-system:fact-cron-trigger-onspd"}
      schedule: "0 8 * * 1-5"
      environment:
        TRIGGER_TYPE: ONSPD_IMPORT
        TRIGGER_ENABLED: true
  chart:
    spec:
      chart: ./stable/fact-cron-trigger
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 5m
