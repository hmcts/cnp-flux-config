apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fact-cron-trigger-csv
spec:
  releaseName: fact-cron-trigger-csv
  values:
    job:
      useInterpodAntiAffinity: true
      image: hmctsprod.azurecr.io/fact/cron-trigger:prod-683f893-20260819093444 #{"$imagepolicy": "flux-system:fact-cron-trigger-csv"}
      schedule: "0 9 * * 1-5"
      environment:
        TRIGGER_TYPE: CSV_GENERATION_NEW
        TRIGGER_ENABLED: true
  chart:
    spec:
      chart: ./stable/fact-cron-trigger
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 5m
