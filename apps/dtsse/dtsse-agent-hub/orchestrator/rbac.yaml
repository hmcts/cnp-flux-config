apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dtsse-agent-hub-orchestrator
  namespace: ${NAMESPACE}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dtsse-agent-hub-orchestrator
  namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dtsse-agent-hub-orchestrator
subjects:
  - kind: ServiceAccount
    name: dtsse-agent-hub-orchestrator
    namespace: ${NAMESPACE}
