apiVersion: v1
kind: ServiceAccount
metadata:
  name: dtsse-agent-hub-orchestrator
  namespace: ${NAMESPACE}
  annotations:
    azure.workload.identity/client-id: "3f8d011c-c955-405a-b348-53a961b85b4b"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dtsse-agent-hub-orchestrator
  namespace: ${NAMESPACE}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dtsse-agent-hub-orchestrator
  namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dtsse-agent-hub-orchestrator
subjects:
  - kind: ServiceAccount
    name: dtsse-agent-hub-orchestrator
    namespace: ${NAMESPACE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtsse-agent-hub-orchestrator
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dtsse-agent-hub-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dtsse-agent-hub-orchestrator
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: dtsse-agent-hub-orchestrator
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: hmctsprod.azurecr.io/dtsse/agent-hub:prod-35ea32a-20261006134817 #{"$imagepolicy": "flux-system:dtsse-agent-hub"}
          command: ["node", "dist/cli/orchestrator.js"]
          env:
            - name: ORCHESTRATOR_CLUSTER
              value: cft-${CLUSTER_FULL_NAME}
            - name: VIRTUAL_AGENT_IMAGE
              value: hmctsprod.azurecr.io/cft-workspace/devcontainer:prod-ef4dd5c-20261008082953@sha256:f52c5224562c38d83c223aa637260fcb5102ebc6f42bf2a2c90460c2613ad8ab #{"$imagepolicy": "flux-system:dtsse-agent-hub-virtual-agent"}
            - name: VIRTUAL_AGENT_HOST_ALIASES
              value: build.hmcts.net=10.10.73.250
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
