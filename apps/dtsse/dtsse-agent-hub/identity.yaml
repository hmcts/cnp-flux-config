apiVersion: managedidentity.azure.com/v1api20181130
kind: UserAssignedIdentity
metadata:
  name: dtsse-agent-hub-${WI_ENVIRONMENT}-mi
  namespace: ${NAMESPACE}
  annotations:
    serviceoperator.azure.com/reconcile-policy: skip
spec:
  location: uksouth
  owner:
    name: managed-identities-${WI_ENVIRONMENT}-rg
---
apiVersion: managedidentity.azure.com/v1api20220131preview
kind: FederatedIdentityCredential
metadata:
  name: dtsse-agent-hub-${WI_CLUSTER}-fic
  namespace: ${NAMESPACE}
spec:
  owner:
    name: dtsse-agent-hub-${WI_ENVIRONMENT}-mi
  audiences:
    - api://AzureADTokenExchange
  issuer: ${ISSUER_URL}
  subject: system:serviceaccount:${NAMESPACE}:dtsse-agent-hub
---
apiVersion: managedidentity.azure.com/v1api20220131preview
kind: FederatedIdentityCredential
metadata:
  name: ${WI_NAME}-dtsse-agent-hub-${WI_CLUSTER}-fic
  namespace: ${NAMESPACE}
spec:
  owner:
    name: ${WI_NAME}-${WI_ENVIRONMENT}-mi
  audiences:
    - api://AzureADTokenExchange
  issuer: ${ISSUER_URL}
  subject: system:serviceaccount:${NAMESPACE}:dtsse-agent-hub
