apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dtsse-dashboard-ingestion
spec:
  releaseName: dtsse-dashboard-ingestion
  values:
    job:
      schedule: "0,10,20,30,40,50 * * * *"
      cpuRequests: "250m"
      memoryRequests: "1Gi"
      environment:
        SLACKBOT_COSMOS_ENABLED: "true"
        GITHUB_APP_RATE_LIMITS_ENABLED: "true"
      keyVaults:
        dtsse:
          secrets:
            - name: AppInsightsConnectionString
              alias: APPLICATIONINSIGHTS_CONNECTION_STRING
            - azure-finops-connection-string
            - github-token
            - sonar-token
            - jira-token
            - db-url
            - cosmos-key
            - cosmos-db-name
            - jenkins-databases
            - snow-username
            - snow-password
            - slackbot-cosmos-key
    global:
      jobKind: CronJob
