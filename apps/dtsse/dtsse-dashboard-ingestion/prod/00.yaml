apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dtsse-dashboard-ingestion
spec:
  releaseName: dtsse-dashboard-ingestion
  values:
    job:
      schedule: "0,10,20,30,40,50 * * * *"
      cpuRequests: "250m"
      memoryRequests: "1Gi"
      environment:
        SLACKBOT_COSMOS_ENABLED: "true"
    global:
      jobKind: CronJob
