apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dtsse-services
spec:
  releaseName: dtsse-services
  interval: 1m
  values:
    java:
      image: hmctsprod.azurecr.io/dtsse/services:prod-861041e-20260930131850 #{"$imagepolicy": "flux-system:dtsse-services"}
      saEnabled: false
      customServiceAccountName: dtsse-services
      environment:
        LISTASSIST_INGEST_ENABLED: "true"
  chart:
    spec:
      chart: ./stable/dtsse-services
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
