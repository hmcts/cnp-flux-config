apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deed-poll-api
spec:
  values:
    java:
      environment:
        # Password-grant tokens (the CCD system user's included) carry ForgeRock's internal issuer, not the
        # discovered hmcts-access one, and its host differs per environment. Everything else comes from the chart.
        IDAM_API_ADDITIONAL_ISSUERS: https://forgerock-am.service.core-compute-idam-ithc.internal:8443/openam/oauth2/realms/root/realms/hmcts
        # CCD-SMOKE steps 1-2 passed in ITHC 2026-10-22/23 (DEEDPOLL imported by api ithc #4; system user verified).
        # Step 3: link one record per case-list request, oldest first, while the first links are checked.
        CCD_LINKING_SWEEP_ENABLED: "true"
        CCD_LINKING_SWEEP_MAX_RECORDS: "1"
        # Pen-test documents in CDAM, as in AAT, so they survive pod replacement and are shared across replicas. CDAM
        # refuses an upload for a record with no CCD case, so each record takes uploads only once the sweep above
        # has linked it. No documents were seeded, so no filesystem files are stranded.
        DOCUMENT_STORE: cdam
        # 100 MiB for durable generated-deed preparation, as in AAT; owned staging stays off.
        DOCUMENT_STAGING_MAX_TOTAL_BYTES: "104857600"
        DOCUMENT_STAGING_ENABLED: "false"
