apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deed-poll-api
spec:
  values:
    java:
      # deed-poll-infra#38 creates the ITHC API identity secrets; they must exist before this patch is merged.
      # Helm replaces this list: retain all six secrets from the API chart.
      keyVaults:
        deed-poll:
          secrets:
            - name: app-insights-connection-string
            - name: postgres-host
              alias: DB_HOST
            - name: postgres-port
              alias: DB_PORT
            - name: postgres-user
              alias: DB_USER_NAME
            - name: postgres-password
              alias: DB_PASSWORD
            - name: notify-api-key
              alias: NOTIFY_API_KEY
            - name: api-idam-client-secret
              alias: IDAM_CLIENT_SECRET
            - name: api-idam-system-username
              alias: DEED_POLL_SYSTEM_USERNAME
            - name: api-idam-system-password
              alias: DEED_POLL_SYSTEM_PASSWORD
            - name: api-s2s-secret
              alias: DEED_POLL_API_S2S_SECRET
      environment:
        IDAM_API_ISSUER_URL: https://hmcts-access.ithc.platform.hmcts.net/o
        # Password-grant tokens (the CCD system user's included) carry ForgeRock's internal issuer, not the
        # discovered hmcts-access one. Keys still come only from IDAM_API_ISSUER_URL's discovery (deed-poll-api#108).
        IDAM_API_ADDITIONAL_ISSUERS: https://forgerock-am.service.core-compute-idam-ithc.internal:8443/openam/oauth2/realms/root/realms/hmcts
        IDAM_API_AUDIENCES: deed-poll-admin,deed-poll-api
        IDAM_API_URL: https://idam-api.ithc.platform.hmcts.net
        IDAM_CLIENT_ID: deed-poll-api
        IDAM_CLIENT_REDIRECT_URI: http://deed-poll-api-ithc.service.core-compute-ithc.internal/receiver
        IDAM_S2S_AUTH_URL: http://rpe-service-auth-provider-ithc.service.core-compute-ithc.internal
        CCD_JURISDICTION_ID: DEEDPOLL
        CCD_CASE_TYPE_ID: DEEDPOLL
        CCD_SYSTEM_ROLE: deed-poll-system-update
        CCD_DATA_STORE_URL: http://ccd-data-store-api-ithc.service.core-compute-ithc.internal
        CASE_DOCUMENT_AM_URL: http://ccd-case-document-am-api-ithc.service.core-compute-ithc.internal
        DOCUMENT_URL_BASE: http://dm-store-ithc.service.core-compute-ithc.internal
        # Off until the DEEDPOLL definition is imported into ITHC's CCD and the system user is verified there.
        CCD_LINKING_SWEEP_ENABLED: "false"
        DOCUMENT_STORE: filesystem
        DOCUMENT_STAGING_ENABLED: "false"
