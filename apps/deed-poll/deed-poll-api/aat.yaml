apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deed-poll-api
spec:
  values:
    java:
      # Apply deed-poll-infra's AAT API identity secrets before merging this patch.
      # Helm replaces this list: retain all six secrets from the API chart.
      keyVaults:
        deed-poll:
          secrets:
            - name: app-insights-connection-string
            - name: postgres-host
              alias: DB_HOST
            - name: postgres-port
              alias: DB_PORT
            - name: postgres-user
              alias: DB_USER_NAME
            - name: postgres-password
              alias: DB_PASSWORD
            - name: notify-api-key
              alias: NOTIFY_API_KEY
            - name: api-idam-client-secret
              alias: IDAM_CLIENT_SECRET
            - name: api-idam-system-username
              alias: DEED_POLL_SYSTEM_USERNAME
            - name: api-idam-system-password
              alias: DEED_POLL_SYSTEM_PASSWORD
            - name: api-s2s-secret
              alias: DEED_POLL_API_S2S_SECRET
      environment:
        IDAM_API_ISSUER_URL: https://hmcts-access.aat.platform.hmcts.net/o
        # Password-grant tokens (the CCD system user's included) carry ForgeRock's internal issuer, not the
        # discovered hmcts-access one. Keys still come only from IDAM_API_ISSUER_URL's discovery (deed-poll-api#108).
        IDAM_API_ADDITIONAL_ISSUERS: https://forgerock-am.service.core-compute-idam-aat2.internal:8443/openam/oauth2/realms/root/realms/hmcts
        IDAM_API_AUDIENCES: deed-poll-admin,deed-poll-api
        IDAM_API_URL: https://idam-api.aat.platform.hmcts.net
        IDAM_CLIENT_ID: deed-poll-api
        IDAM_CLIENT_REDIRECT_URI: http://deed-poll-api-aat.service.core-compute-aat.internal/receiver
        IDAM_S2S_AUTH_URL: http://rpe-service-auth-provider-aat.service.core-compute-aat.internal
        CCD_JURISDICTION_ID: DEEDPOLL
        CCD_CASE_TYPE_ID: DEEDPOLL
        CCD_SYSTEM_ROLE: deed-poll-system-update
        CCD_DATA_STORE_URL: http://ccd-data-store-api-aat.service.core-compute-aat.internal
        CASE_DOCUMENT_AM_URL: http://ccd-case-document-am-api-aat.service.core-compute-aat.internal
        DOCUMENT_URL_BASE: http://dm-store-aat.service.core-compute-aat.internal
        # CCD-SMOKE steps 1-2 passed 2026-10-16 (DEEDPOLL v1 imported; system user and /ccd-persistence verified).
        # Step 3: link one record per case-list request, oldest first, while the first links are checked.
        CCD_LINKING_SWEEP_ENABLED: "true"
        CCD_LINKING_SWEEP_MAX_RECORDS: "1"
        # AAT test documents must survive API pod replacement and be shared across replicas.
        # Existing Local test documents must be re-uploaded; this does not migrate their files.
        DOCUMENT_STORE: cdam
        # 100 MiB AAT capacity for durable generated-deed preparation; owned staging stays off.
        DOCUMENT_STAGING_MAX_TOTAL_BYTES: "104857600"
        DOCUMENT_STAGING_ENABLED: "false"
