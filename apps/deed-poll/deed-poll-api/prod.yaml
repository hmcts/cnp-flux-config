apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deed-poll-api
spec:
  values:
    java:
      environment:
        # Prod's IDAM hosts carry no environment segment, so the chart's {env} pattern is wrong here.
        IDAM_API_ISSUER_URL: https://hmcts-access.service.gov.uk/o
        IDAM_API_URL: https://idam-api.platform.hmcts.net
        # ForgeRock's internal issuer, carried by password-grant tokens; its host differs per environment.
        IDAM_API_ADDITIONAL_ISSUERS: https://forgerock-am.service.core-compute-idam-prod2.internal:8443/openam/oauth2/realms/root/realms/hmcts
