apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# deed-poll-api and deed-poll-admin are removed from demo for now (2026-11-09): demo ran a pinned 2026-10-02 image with
# no staff gate and was not kept up. The namespace, RBAC and workload identity stay so the apps can be restored by
# reverting this change.
resources:
  - ../../base
  - ../../../rbac/nonprod-role.yaml
namespace: deed-poll
patches:
  - path: ../../serviceaccount/demo.yaml
