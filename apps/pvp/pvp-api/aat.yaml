apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pvp-api
spec:
  # AAT reads iCasework UAT, which holds test data, instead of the stand-in: pvp-api's
  # charts/pvp-api/values.icasework-uat.yaml. The key and secret are set in pvp-aat by hand
  # (tools/set_icasework_keys.sh); without them the pod can't mount its secrets.
  values:
    standin:
      enabled: false
    python:
      environment:
        PVP_DATA_CLASS: synthetic
        PVP_OPTIC_ENVIRONMENT: uat
        # "" not null: kustomize drops a null key from the patch, which would leave the chart's stand-in
        # values in place. The API reads a blank variable as unset and fills the key and secret from the vault.
        PVP_OPTIC_STANDIN_URL: ""
        PVP_OPTIC_REPORT_IDS: ""
        PVP_OPTIC_API_KEY: ""
        PVP_OPTIC_API_SECRET: ""
        # Entra sign-in: the tenant and AAT's app registration (pvp-aat), whose tokens the API accepts. Not secrets.
        PVP_ENTRA_TENANT_ID: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
        PVP_ENTRA_CLIENT_ID: "be03228f-72cb-4382-8e09-3d859faa3b76"
      keyVaults:
        pvp:
          secrets:
            - name: database-url
              alias: PVP_DATABASE_URL
            - name: app-insights-connection-string
              alias: APPLICATIONINSIGHTS_CONNECTION_STRING
            - name: optic-api-key
              alias: PVP_OPTIC_API_KEY
            - name: optic-api-secret
              alias: PVP_OPTIC_API_SECRET
