---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: labs-harveymoj
  namespace: labs
spec:
  releaseName: labs-harveymoj
  chart:
    spec:
      chart: ./stable/labs-harveymoj
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
  values:
    java:
      image: hmctssandbox.azurecr.io/labs/harveymoj:latest # {"$imagepolicy": "flux-system:labs-harveymoj"}
      disableTraefikTls: true
