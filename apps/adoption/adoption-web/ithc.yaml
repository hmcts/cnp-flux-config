apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adoption-web
spec:
  releaseName: adoption-web
  interval: 1m
  values:
    nodejs:
      readinessPeriod: 15
      image: hmctsprod.azurecr.io/adoption/web:prod-97bcf77-20261109113352 #{"$imagepolicy": "flux-system:ithc-adoption-web"}
      environment:
        PCQ_ENABLED: "true"
        SECURE_COOKIE: 'true'
        REDIS_PORT: 6380
        RATE_LIMIT_ENABLED: true
        RATE_LIMIT_WINDOW_SECONDS: 60
        RATE_LIMIT_MAX_REQUESTS: 6
        EXPRESS_NUMBER_TRUST_PROXIES: 3
        IDAM_WEB_URL: 'https://idam-web-public.ithc.platform.hmcts.net/o/authorize'
        IDAM_END_SESSION_URL: 'https://idam-web-public.ithc.platform.hmcts.net/o/endSession'
