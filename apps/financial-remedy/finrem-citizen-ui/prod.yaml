apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: finrem-citizen-ui
  namespace: financial-remedy
spec:
  releaseName: finrem-citizen-ui
  values:
    nodejs:
      ingressHost: finrem-citizen-ui.prod.platform.hmcts.net
      ingressSessionAffinity:
        enabled: true
        sessionCookieName: sticky
      environment:
        RESTART_MANUALLY: 4
        CASE_DOCUMENT_MANAGEMENT_URL: http://ccd-case-document-am-api-prod.service.core-compute-prod.internal
        IDAM_WEB_URL: https://hmcts-access.service.gov.uk/o/authorize
        IDAM_API_URL: https://idam-api.platform.hmcts.net/o/token
        OAUTH_CALLBACK_URL: https://finrem-citizen-ui.prod.platform.hmcts.net/oauth2/callback
        CCD_URL: http://ccd-data-store-api-prod.service.core-compute-prod.internal
        OIDC_ISSUER: https://hmcts-access.service.gov.uk/o
    global:
      environment: prod
      enableKeyVaults: true
