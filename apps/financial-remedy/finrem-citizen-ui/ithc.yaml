apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: finrem-citizen-ui
  namespace: financial-remedy
spec:
  releaseName: finrem-citizen-ui
  values:
    nodejs:
      image: hmctsprod.azurecr.io/finrem/citizen-ui:prod-3fb3c36-20260825073542 #{"$imagepolicy": "flux-system:ithc-finrem-citizen-ui"}
      ingressHost: finrem-citizen-ui.ithc.platform.hmcts.net
      ingressSessionAffinity:
        enabled: true
        sessionCookieName: sticky
      environment:
        RESTART_MANUALLY: 0
        CASE_DOCUMENT_MANAGEMENT_URL: http://ccd-case-document-am-api-ithc.service.core-compute-ithc.internal
        IDAM_WEB_URL: https://hmcts-access.ithc.platform.hmcts.net/o/authorize
        IDAM_API_URL: https://idam-api.ithc.platform.hmcts.net/o/token
        OAUTH_CALLBACK_URL: https://finrem-citizen-ui.ithc.platform.hmcts.net/oauth2/callback
        CCD_URL: http://ccd-data-store-api-ithc.service.core-compute-ithc.internal
        REDIS_CONNECTION_STRING: redis://finrem-citizen-ui-redis-master:6379
        OIDC_ISSUER: https://hmcts-access.ithc.platform.hmcts.net/o
    redis:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
      master:
        persistence:
          enabled: false
      image:
        registry: hmctsprod.azurecr.io
        repository: imported/bitnami/redis
    global:
      security:
        allowInsecureImages: true
      environment: ithc
      enableKeyVaults: true
      DUMMY_VAR: 1
