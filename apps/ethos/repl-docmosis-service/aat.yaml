apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: repl-docmosis-service
  namespace: ethos
spec:
  releaseName: repl-docmosis-service
  values:
    java:
      replicas: 2
      environment:
        SECURE_DOC_STORE_FEATURE: false
        TRIGGER_RESTART: 4
        DB_QUEUE_ENABLED: true
        ERA_ENABLED: true
        ERA_START_DATE: 2026-09-01